<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Whisker">
<meta name="theme-color" content="#ffe4f1">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Whisker Academy — a maths adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2a4f; --muted:#7a6990; --line:#efe3f7;
  --pink:#ff6fae; --pink-d:#d94a8c; --mint:#36c9a0; --mint-d:#22a37f; --sun:#ffc43d; --sun-d:#e09b12;
  --shadow:0 5px 0 rgba(59,42,79,.10),0 10px 24px rgba(59,42,79,.10);
  --font:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --d:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#fff3f8}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);background-image:linear-gradient(180deg,#ffe4f1,#fff8ef);background-attachment:fixed;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #7cc7ff;outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:640px;margin:0 auto;padding:12px 14px 112px;min-height:100vh}
#app.playing{padding-bottom:16px}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tiny{font-size:14px;color:var(--muted)}
.sec{font-size:30px;margin:16px 4px 10px}
.sub{font-size:20px;margin:18px 4px 8px}
.card{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pink);color:#fff;font-weight:800;font-size:20px;padding:8px 22px;min-height:52px;border-radius:18px;box-shadow:0 5px 0 var(--pink-d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.sun{background:var(--sun);color:#5a3b00;box-shadow:0 5px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e2d4ee}
.btn.big{font-size:24px;padding:10px 34px;min-height:60px}
.btn:disabled{opacity:.45}
.chip{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #e2d4ee;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#ffe1ef;box-shadow:0 3px 0 #ffb3d4;color:var(--pink-d)}
.chip:disabled{opacity:.45}

/* top bar */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:2px 14px 2px 2px;box-shadow:var(--shadow)}
.me .nm{font-weight:800;font-size:17px;line-height:1}
.me .rk{font-size:12px;color:var(--muted);line-height:1.2}
.pill{background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:18px;box-shadow:var(--shadow);display:inline-flex;gap:4px;align-items:center;white-space:nowrap;min-height:40px}
.pill.pop{animation:pop .35s}
.gear{font-size:18px}

/* cat */
.cat{position:relative;display:inline-block;flex:none}
.cat svg{position:relative;z-index:1;width:100%;height:100%;display:block;overflow:visible}
.cat .acc{position:absolute;z-index:2;line-height:1;pointer-events:none}
.cat .acc.behind{z-index:0}
.petbtn{border-radius:50%}
.petbtn:active .cat{transform:scale(.94)}
.cat.bounce{animation:bounce .5s}
.cat.idle svg{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 90%}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:2px solid var(--line);z-index:20}
nav.tabs button{flex:1;max-width:116px;padding:4px 2px;border-radius:16px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;color:var(--muted)}
nav.tabs .i{font-size:27px;line-height:1.15}
nav.tabs button.on{background:#ffe3f1;color:var(--pink-d)}
nav.tabs .badge{position:absolute;margin-left:28px;margin-top:-2px;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}

/* companion & map */
.companion{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.bubble{position:relative;background:#fff;border-radius:20px;padding:10px 14px;font-size:17px;font-weight:600;box-shadow:var(--shadow);line-height:1.3;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bubble.small{font-size:16px;padding:8px 12px;min-height:44px}
.rankbar{background:rgba(255,255,255,.85);border-radius:16px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.meter{flex:1;height:14px;background:#f1e8f8;border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ff9fca);border-radius:99px}
.realm-head{display:flex;align-items:center;gap:8px;margin:16px 0 2px}
.realm-head h1{font-size:28px;flex:1;text-align:center}
.arrow{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:20px;flex:none}
.arrow:disabled{opacity:.35}
.realm-dots{display:flex;justify-content:center;gap:6px;margin:6px 0}
.realm-dots button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);font-size:20px}
.realm-dots button.on{background:#fff;box-shadow:0 0 0 3px var(--pink)}
.realm-dots button.lock{filter:grayscale(1);opacity:.5}
.realm-intro{text-align:center;font-size:16px;margin:2px 12px 0;color:var(--muted)}
.realm-track{text-align:center;font-size:14px;font-weight:800;color:var(--pink-d);letter-spacing:.04em;text-transform:uppercase}
body.dark .realm-head h1, body.dark .realm-intro{color:#fff}
body.dark .realm-track{color:#ffd36b}
.path{position:relative;margin:4px auto 0}
.path svg.trail{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid #fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(59,42,79,.18);color:var(--ink)}
.node.done{background:var(--sun)}
.node.current{background:var(--pink);color:#fff;animation:pulse 1.6s infinite}
.node.locked{background:#ebe5f1;color:#b4aac2;font-size:24px}
.node.boss{width:98px;height:98px;font-size:44px}
.node.boss.locked{font-size:30px}
.node .st{position:absolute;bottom:-14px;font-size:17px;letter-spacing:-1px;color:#ffb400;text-shadow:0 2px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}
.node .lname{position:absolute;top:calc(100% + 12px);white-space:nowrap;font-size:13px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);padding:0 8px;border-radius:8px}
.you{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation:hop 1.4s ease-in-out infinite}
.lockcard{text-align:center;margin:24px 0}
.lockcard .big{font-size:64px}

/* practice */
.pcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.pcard.col{flex-direction:column;align-items:stretch}
.pcard .pi{font-size:42px;width:56px;text-align:center;flex:none}
.pcard h3{font-size:22px}
.pcard p{font-size:15px;color:var(--muted);line-height:1.3}
.pcard .grow{flex:1}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tbtn{background:#fff6fb;border-radius:16px;box-shadow:0 3px 0 #f2d6e6;padding:8px 4px;font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.tbtn small{font-size:12px;color:var(--muted);font-weight:700}
.minibar{width:80%;height:6px;background:#f0e6f6;border-radius:9px;overflow:hidden;margin-top:3px}
.minibar i{display:block;height:100%;background:var(--mint)}

/* closet */
.closet-hero{display:flex;align-items:center;gap:16px;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:14px 18px}
.catname{font-size:28px;font-weight:800}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.sw{background:#fff;border-radius:18px;padding:8px 4px;box-shadow:0 3px 0 #e8dcf2;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px}
.sw .dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink)}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item .ie{font-size:42px;line-height:1.1}
.item .in{font-weight:700;font-size:15px;line-height:1.1}
.item.worn{box-shadow:0 0 0 3px var(--mint),var(--shadow)}
.item .chip{font-size:15px;min-height:40px}

/* album */
.seg{display:flex;background:#fff;border-radius:18px;padding:4px;gap:4px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:14px;font-weight:700;font-size:15px;min-height:44px}
.seg button.on{background:#ffe1ef;color:var(--pink-d)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stk{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;position:relative;border:4px solid #fff}
.stk span{font-size:44px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(59,42,79,.15))}
.stk small{font-size:13px;font-weight:700;text-align:center;line-height:1.1}
.stk.r-r{border-color:#9ad8ff}
.stk.r-l{border-color:#ffd256;background:linear-gradient(180deg,#fff9e0,#fff)}
.stk.empty{background:#f6f1fa;box-shadow:none}
.stk.empty span{color:#cfc3dd;font-weight:800;filter:none}
.stk .cnt{position:absolute;top:4px;right:8px;font-size:12px;color:var(--muted)}
.stk.big{width:110px;padding:14px}
.stk.big span{font-size:64px}
.drawings{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.drawings button{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#fff;aspect-ratio:1}
.drawings img{width:100%;height:100%;object-fit:cover;display:block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px;text-align:center}
.bdg .be{font-size:36px}
.bdg b{display:block;font-size:15px}
.bdg small{font-size:12px;color:var(--muted);line-height:1.1;display:block}
.bdg.off{background:#f6f1fa;box-shadow:none;opacity:.7}
.bdg.off .be{filter:grayscale(1);opacity:.4}
.empty-note{text-align:center;color:var(--muted);padding:30px 10px;font-size:17px}

/* studio */
.challenge .chl{font-weight:800;color:var(--pink-d);font-size:15px}
.challenge .cht{font-size:20px;font-weight:700;line-height:1.25;margin:2px 0 8px}
.challenge .chq{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:17px}
.smallin{width:80px;height:44px;border-radius:14px;border:3px solid #ead9f5;font-size:22px;font-weight:800;text-align:center;color:var(--ink)}
.ok{color:var(--mint-d)}
.studio{margin-top:14px}
#cv{width:100%;max-width:560px;aspect-ratio:1;display:block;margin:0 auto;background:#fff;border-radius:24px;box-shadow:var(--shadow);touch-action:none;cursor:crosshair}
.tools{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.colr{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.colr.on{box-shadow:0 0 0 4px var(--ink)}
.size i{display:inline-block;border-radius:50%;background:var(--ink)}

/* play */
.play{display:flex;flex-direction:column;gap:10px}
.play-top{display:flex;gap:10px;align-items:center}
.xbtn{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px;font-weight:800;flex:none}
.prog{flex:1;height:22px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#3ccfa5,#9be8a8);border-radius:999px;transition:width .45s}
.timer{height:14px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9a5a,var(--sun))}
.coach{display:flex;align-items:center;gap:8px}
.combo{font-weight:800;font-size:18px;color:#ff7a1a;background:#fff;border-radius:999px;padding:4px 12px;box-shadow:var(--shadow);opacity:0;transform:scale(.6);transition:all .25s;white-space:nowrap}
.combo.on{opacity:1;transform:scale(1)}
.combo.bump{animation:pop .35s}
.qcard{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:14px 14px 16px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.qlabel{font-size:14px;font-weight:700;color:var(--muted)}
.tag{background:#e3f8ef;color:var(--mint-d);border-radius:99px;padding:0 8px;margin-left:4px}
.word{font-size:21px;font-weight:600;line-height:1.3}
.qtext{font-size:clamp(42px,11vw,62px);font-weight:800;line-height:1.05;white-space:nowrap}
.wordans{font-size:30px}
.qtext.long{font-size:clamp(26px,7.5vw,40px);white-space:normal;line-height:1.25}
.grps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
.g1{border:3px dashed #e3d3f0;border-radius:16px;padding:4px 6px;font-size:20px;line-height:1.1;max-width:120px;word-break:break-all;background:#fffafd}
.area{display:flex;width:min(320px,90%);height:74px;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.ar{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffe1ef;font-size:17px;min-width:84px;line-height:1.15}
.ar.o{background:#d9f6ea;border-left:3px solid var(--ink)}
.ar span{font-size:20px;font-weight:800;color:var(--mint-d)}
.crystals{background:rgba(255,255,255,.88);border-radius:16px;padding:8px 10px;margin-top:8px}
.crhead{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:4px}
.crhead span{color:var(--muted);font-size:13px}
.gems{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.gem{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;padding:4px 0 2px;border-radius:10px;min-height:46px;color:var(--ink)}
.gem span{font-size:21px;line-height:1.1;filter:grayscale(1) opacity(.3)}
.gem.l1 span{filter:grayscale(.6) opacity(.6)}
.gem.l2 span{filter:none}
.gem.l3{background:#e7f4ff;box-shadow:0 0 0 2px #9fd6ff}
.gem.l3 span{filter:drop-shadow(0 0 5px #48b4ff);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.bonus-tag{display:inline-block;background:#fff3c4;color:#8a6200;border-radius:99px;padding:0 8px;font-size:12px;margin-left:4px}
.ans{display:inline-block;min-width:1.5em;padding:0 .18em;border-radius:16px;background:#fff0f7;color:var(--pink-d);border:3px dashed #ffb7d6}
.ans.reveal{background:#e3f8ef;border-color:#9fe3c8;color:var(--mint-d)}
.ans.right{background:#e3f8ef;border:3px solid var(--mint);color:var(--mint-d)}
.helpers{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:58px;font-size:30px;font-weight:800;background:#fff;border-radius:18px;box-shadow:0 5px 0 #e2d4ee}
.keypad button:active{transform:translateY(4px);box-shadow:0 1px 0 #e2d4ee}
.keypad .ok{background:var(--mint);color:#fff;box-shadow:0 5px 0 var(--mint-d)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{height:78px;font-size:38px;font-weight:800;background:#fff;border-radius:22px;box-shadow:0 6px 0 #e2d4ee}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #e2d4ee}
.choice.wrongc{opacity:.35;text-decoration:line-through}
.hint,.explain{background:#fff8e6;border-radius:18px;padding:10px 12px;font-size:18px;line-height:1.35;font-weight:600}
.explain{background:#eefaf5}
.exhead{font-weight:800;color:var(--mint-d)}
.exeq{font-size:34px;font-weight:800}
.explain .btn{margin-top:8px}
.bossbar{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:22px;padding:8px 14px;box-shadow:var(--shadow)}
.gface{font-size:52px;line-height:1;transition:transform .2s}
.gface.hit{animation:wiggle .5s}
.gname{font-weight:800;font-size:17px}
.joy{height:14px;background:#f1e8f8;border-radius:99px;overflow:hidden;margin:3px 0}
.joy i{display:block;height:100%;background:linear-gradient(90deg,#ff9fca,var(--sun));transition:width .4s}
.garden-row{text-align:center;font-size:26px;letter-spacing:2px;background:rgba(255,255,255,.85);border-radius:18px;padding:4px}

/* visuals */
.vis{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
.arr{display:inline-flex;flex-direction:column;gap:3px;line-height:1}
.arr div{white-space:nowrap}
.dots{display:inline-grid;gap:3px}
.dots i{width:var(--d);height:var(--d);border-radius:50%;background:var(--pink)}
.dots i.b{background:var(--mint)}
.tfwrap{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tf{display:grid;grid-template-columns:repeat(5,22px);gap:4px;padding:6px;border:3px solid #e8dcf3;border-radius:12px}
.tf i{width:22px;height:22px;border-radius:50%;background:#f3eef8}
.tf i.a{background:var(--pink)}
.tf i.b{background:var(--mint)}
.cap{font-size:15px;color:var(--muted);font-weight:700}
.ca{color:var(--pink-d)} .cb{color:var(--mint-d)}
.b10{display:inline-flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.grp{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap;max-width:200px}
.rod{width:11px;height:66px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--c) 0 5.6px,rgba(255,255,255,.7) 5.6px 6.6px)}
.cube{width:11px;height:11px;border-radius:2px;background:var(--c)}
.ga{--c:var(--pink)} .gb{--c:var(--mint)}
.plus{font-size:26px;font-weight:800;align-self:center}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(59,42,79,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:30px;padding:22px 18px;max-width:440px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popin .35s cubic-bezier(.3,1.5,.6,1)}
.modal h2{font-size:28px;margin-bottom:6px}
.modal p{font-size:17px;line-height:1.35;margin:6px 0}
.stars3{display:flex;justify-content:center;gap:6px;margin:6px 0}
.bigstar{font-size:62px;color:#eadff3;line-height:1;transition:color .2s}
.bigstar:nth-child(2){font-size:76px;margin-top:-10px}

/* parents */

/* cat moves */
.cat{transform-origin:50% 62%}

/* ---- v4: rigged cartoon cat (parts animate independently) ---- */
.kitty *{transform-box:view-box}
.kitty .k-tail{transform-origin:150px 160px}
.kitty .k-head{transform-origin:100px 140px}
.kitty .k-earL{transform-origin:70px 62px}.kitty .k-earR{transform-origin:130px 62px}
.kitty .k-eyeL{transform-origin:76px 85px}.kitty .k-eyeR{transform-origin:124px 85px}
.kitty .k-hL{transform-origin:76px 85px}.kitty .k-hR{transform-origin:124px 85px}
.kitty .k-armL{transform-origin:60px 142px}.kitty .k-armR{transform-origin:140px 142px}
.kitty .k-legL{transform-origin:80px 186px}.kitty .k-legR{transform-origin:120px 186px}
.kitty .m-open{transform-origin:100px 106px}.kitty .k-all{transform-origin:100px 196px}
.kitty .e-happy,.kitty .e-sleepy,.kitty .e-heart,.kitty .k-brows,.kitty .m-grin,.kitty .m-open,.kitty .m-sad,.kitty .k-thumb{display:none}
.md-happy .e-open{display:none}.md-happy .e-happy{display:inline}.md-happy .m-smile{display:none}.md-happy .m-grin{display:inline}
.md-sleepy .e-open{display:none}.md-sleepy .e-sleepy{display:inline}
.md-wow .m-smile{display:none}.md-wow .m-open{display:inline}
.md-oops .k-brows{display:inline}.md-oops .m-smile{display:none}.md-oops .m-sad{display:inline}
.md-think .k-brows{display:inline}
/* always-on life: blink, tail swish, ear twitch, glance around, gentle head bob */
.kitty .k-eyeL,.kitty .k-eyeR{animation:kBlink 4.6s infinite;animation-delay:var(--bd,0s)}
.kitty .k-tail{animation:kTail 2.6s ease-in-out infinite alternate;animation-delay:calc(var(--bd,0s) * -1)}
.kitty .k-earR{animation:kEarR 6.5s infinite;animation-delay:var(--bd,0s)}
.kitty .k-earL{animation:kEarL 8.3s infinite;animation-delay:calc(var(--bd,0s) + 1.7s)}
.kitty .e-open{animation:kLook 9s ease-in-out infinite;animation-delay:calc(var(--bd,0s) * -2)}
.kitty .k-head{animation:kHead 4.8s ease-in-out infinite;animation-delay:calc(var(--bd,0s) * -1)}
.md-happy .k-tail{animation:kWag .45s ease-in-out infinite alternate}
.md-oops .k-earL{animation:none;transform:rotate(-20deg)}.md-oops .k-earR{animation:none;transform:rotate(20deg)}.md-oops .k-tail{animation:none;transform:rotate(18deg)}
.md-think .k-armR{transform:rotate(-150deg)}.md-think .e-open{animation:none;transform:translate(3px,-4px)}.md-think .k-head{animation:none;transform:rotate(-6deg)}
.md-wow .k-earL{animation:none;transform:rotate(8deg)}.md-wow .k-earR{animation:none;transform:rotate(-8deg)}
/* any move: happy face */
.cat.moving .e-open,.cat.moving .e-sleepy,.cat.moving .k-brows,.cat.moving .m-smile,.cat.moving .m-sad,.cat.moving .m-open{display:none}
.cat.moving .e-happy,.cat.moving .m-grin{display:inline}
.cat.mv-hearts .e-happy{display:none}.cat.mv-hearts .e-heart{display:inline}
.cat.mv-sing .m-grin{display:none}.cat.mv-sing .m-open{display:inline}
.cat.mv-thumbs .k-thumb{display:inline}
.cat.moving .k-tail{animation:kWag .3s ease-in-out infinite alternate}
.cat.moving .k-armR,.cat.moving .k-armL,.cat.moving .k-legL,.cat.moving .k-legR,.cat.moving .k-head{transform:none}
/* move choreography */
.cat.mv-hop .k-armL{animation:aUpL .6s ease-out}.cat.mv-hop .k-armR{animation:aUpR .6s ease-out}
.cat.mv-wave .k-armR{animation:aWave 1.5s ease-in-out}.cat.mv-wave .k-head{animation:hTiltR 1.5s ease-in-out}
.cat.mv-thumbs .k-armR{animation:aThumb 1.4s cubic-bezier(.3,1.4,.5,1)}.cat.mv-thumbs .k-head{animation:hNod 1.4s ease-in-out}
.cat.mv-jump .k-armL{animation:aUpL 1s ease-out}.cat.mv-jump .k-armR{animation:aUpR 1s ease-out}.cat.mv-jump .k-legL,.cat.mv-jump .k-legR{animation:lDangle 1s ease-out}
.cat.mv-wiggle .k-earL{animation:eFlopL .5s ease-in-out 2}.cat.mv-wiggle .k-earR{animation:eFlopR .5s ease-in-out 2}.cat.mv-wiggle .k-armL{animation:aFlapL .25s ease-in-out 4}.cat.mv-wiggle .k-armR{animation:aFlapR .25s ease-in-out 4}
.cat.mv-dance .k-armL{animation:aDanceL 2s ease-in-out}.cat.mv-dance .k-armR{animation:aDanceR 2s ease-in-out}.cat.mv-dance .k-legL{animation:lStepA .5s ease-in-out 4}.cat.mv-dance .k-legR{animation:lStepB .5s ease-in-out 4}.cat.mv-dance .k-head{animation:hBop .5s ease-in-out 4}
.cat.mv-spin .k-armL{animation:aOutL 1.2s ease-in-out}.cat.mv-spin .k-armR{animation:aOutR 1.2s ease-in-out}
.cat.mv-sing .m-open{animation:mSing .28s ease-in-out 6}.cat.mv-sing .k-armL{animation:aMicL 1.7s ease-in-out}.cat.mv-sing .k-armR{animation:aOutR 1.7s ease-in-out}.cat.mv-sing .k-head{animation:hSway .85s ease-in-out 2}
.cat.mv-hearts .k-hL,.cat.mv-hearts .k-hR{animation:hPulse .36s ease-in-out 4}.cat.mv-hearts .k-armL{animation:aHugL 1.45s ease-in-out}.cat.mv-hearts .k-armR{animation:aHugR 1.45s ease-in-out}
.cat.mv-moonwalk .k-legL{animation:lSlideA .5s linear 4}.cat.mv-moonwalk .k-legR{animation:lSlideB .5s linear 4}.cat.mv-moonwalk .k-armL{animation:aSwingL .5s ease-in-out 4}.cat.mv-moonwalk .k-armR{animation:aSwingR .5s ease-in-out 4}.cat.mv-moonwalk .k-head{animation:hBop .5s ease-in-out 4}
.cat.mv-cartwheel .k-armL{animation:aCartL 1.6s ease-in-out}.cat.mv-cartwheel .k-armR{animation:aCartR 1.6s ease-in-out}.cat.mv-cartwheel .k-legL{animation:lSplitL 1.6s ease-in-out}.cat.mv-cartwheel .k-legR{animation:lSplitR 1.6s ease-in-out}
.cat.mv-backflip .k-armL{animation:aFlipL 1.25s ease-in-out}.cat.mv-backflip .k-armR{animation:aFlipR 1.25s ease-in-out}.cat.mv-backflip .k-legL,.cat.mv-backflip .k-legR{animation:lTuck 1.25s ease-in-out}
.cat.mv-superstar .k-armL{animation:aStarL 1.4s ease-in-out}.cat.mv-superstar .k-armR{animation:aStarR 1.4s ease-in-out}.cat.mv-superstar .k-legL{animation:lSplitL 1.4s ease-in-out}.cat.mv-superstar .k-legR{animation:lSplitR 1.4s ease-in-out}
@keyframes kBlink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes kTail{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
@keyframes kWag{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes kEarR{0%,84%,100%{transform:rotate(0)}87%{transform:rotate(-12deg)}90%{transform:rotate(4deg)}93%{transform:rotate(-6deg)}}

/* Halving Slice */
#blade{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#24184a 0%,#4b3290 55%,#b0629e 100%);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;display:flex;flex-direction:column}
.hb-sky{position:absolute;inset:0;pointer-events:none}
.hb-moon{position:absolute;right:8%;top:12%;font-size:64px;opacity:.9}
.hb-home{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:min(46vw,300px);line-height:1;opacity:.22;filter:grayscale(.4)}
.hb-field{position:relative;flex:1;overflow:hidden}
.hb-field canvas{position:absolute;inset:0;display:block;touch-action:none}
.hb-order{position:absolute;z-index:3;top:66px;left:12px;right:12px;pointer-events:none;text-align:center;color:#fff;font-weight:700;font-size:18px;opacity:0;transition:opacity .3s}
.hb-order.on{opacity:1;background:rgba(255,243,196,.95);color:#4a3200;border-radius:16px;padding:6px 10px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.hb-order b{font-size:26px;color:#a35f00}
.hb-hint{display:block;font-size:15px;color:#6b5000}
.hb-demo{font-size:22px;line-height:1.5;margin:8px 0;background:#fff0f7;border-radius:14px;padding:6px}
.hb-demo b{display:inline-block;min-width:1.6em;background:#e0559a;color:#fff;border-radius:99px;padding:0 8px}
.hb-demo b:nth-of-type(n+2){background:#2f9e68}
.pcard .hofbtn{flex:none}
@media (min-width:700px){.hb-order{font-size:22px}.hb-order b{font-size:32px}}
/* Hall of Fame: old-school arcade high-score table */
.modal.hofm{background:#120d2e;color:#fff;border:4px solid #ffc43d;box-shadow:0 0 0 4px #120d2e,0 0 30px #ff6fae,0 20px 60px rgba(0,0,0,.5)}
.hof{font-family:"Courier New",ui-monospace,monospace;font-weight:900;text-transform:uppercase}
.hof-title{font-size:26px;color:#ffd84a;text-shadow:0 0 8px #ff9a3d,3px 3px 0 #d94a8c;letter-spacing:2px}
.hof-sub{font-size:13px;color:#7fe8ff;letter-spacing:3px;margin:2px 0 8px}
.hof-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.hof-tabs button{font:inherit;font-size:14px;color:#9a8fc7;background:#221a4d;border-radius:10px;padding:6px 12px}
.hof-tabs button.on{color:#120d2e;background:#7fe8ff}
.hof-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hof-row{display:grid;grid-template-columns:3.2em auto 1fr auto;align-items:center;gap:8px;background:#1d1645;border-radius:12px;padding:3px 10px;text-align:left}
.hof-row.p1{background:linear-gradient(90deg,#4a3a00,#1d1645)}.hof-row.p2{background:linear-gradient(90deg,#3b3f4f,#1d1645)}.hof-row.p3{background:linear-gradient(90deg,#4a2a14,#1d1645)}
.hof-row.me{outline:3px solid #ff6fae;animation:hofMe 1.2s steps(2) infinite}
@keyframes hofMe{50%{outline-color:#ffd84a}}
.hof-pos{font-size:18px;color:#ffd84a;text-align:center}
.hof-who{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.hof-who b{font-size:18px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hof-who small{font-size:10px;color:#7fe8ff;letter-spacing:1px;font-weight:700}
.hof-score{font-size:20px;color:#7dff8a;text-shadow:0 0 6px #2bd14a;letter-spacing:1px}
.hof-me{margin-top:10px;color:#ffd84a;font-size:15px}.hof-me small{color:#9a8fc7;font-size:11px}
.hof-empty{padding:26px 0;color:#7fe8ff;font-size:18px}.hof-empty small{color:#9a8fc7;font-size:12px}
.blink{animation:hofBlink 1s steps(2) infinite}
@keyframes hofBlink{50%{opacity:.25}}
.hof-close{margin-top:12px;font-family:inherit}

const NOVELTY=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Pipe Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Kathy|Princess|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;
let VOICE; // undefined = not decided yet, null = device default
function allVoices(){try{return speechSynthesis.getVoices()||[]}catch(e){return []}}
function goodVoices(){return allVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)).sort((a,b)=>vQual(b)-vQual(a)||a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name))}
function vQual(v){return /premium|enhanced|natural|neural/i.test(v.name+' '+v.voiceURI)?2:/google|online/i.test(v.name)?1:0}
function savedVoice(){try{return localStorage.getItem(VOICE_KEY)||''}catch(e){return ''}}
function pickVoice(){
  const want=savedVoice(),vs=allVoices();
  if(want&&want!=='default'){const v=vs.find(v=>v.voiceURI===want);if(v)return v;if(!vs.length)return undefined}
  if(/^en/i.test(navigator.language||'en'))return null; // English device: keep its own default voice
  if(!vs.length)return undefined;
  return goodVoices()[0]||null;
}
function resolveVoice(){if(VOICE===undefined){const v=pickVoice();if(v!==undefined)VOICE=v}return VOICE||null}
function fracWords(a,b){return FU[b]?`${a} ${Number(a)===1?FU[b]:(b==2?'halves':FN[b])}`:`${a} over ${b}`}
function speechText(t){return String(t).replace(/<[^>]+>/g,' ').replace(/(\d+)\s*\/\s*(\d+)/g,(m,a,b)=>fracWords(a,b)).replace(/÷/g,' divided by ').replace(/×/g,' times ').replace(/\+/g,' plus ').replace(/=/g,' equals ').replace(/→/g,', then ').replace(/−/g,' minus ').replace(/□/g,' what ').replace(/&lt;/g,' is less than ').replace(/&gt;/g,' is more than ').replace(/\s+/g,' ').trim()}
function speak(t){
  if(!t||!('speechSynthesis' in window))return;
  const txt=speechText(t);
  const go=()=>{try{const v=resolveVoice(),u=new SpeechSynthesisUtterance(txt);if(v){u.voice=v;u.lang=v.lang}u.rate=1;u.pitch=1;u.volume=1;if(P&&P.qt&&UI.screen==='play'){const rel=qtHold();u.onend=u.onerror=rel;setTimeout(rel,Math.min(20000,1500+txt.length*110))}
    const busy=speechSynthesis.speaking||speechSynthesis.pending;if(busy)speechSynthesis.cancel();
    if(busy)setTimeout(()=>speechSynthesis.speak(u),80);else speechSynthesis.speak(u)}catch(e){}};
  if(savedVoice()&&savedVoice()!=='default'&&VOICE===undefined&&!allVoices().length){let done=false;const f=()=>{if(done)return;done=true;go()};try{speechSynthesis.addEventListener('voiceschanged',f,{once:true})}catch(e){}setTimeout(f,800);return}
  go();
}
function unlockSpeech(){if(UI.speechUnlocked||!('speechSynthesis' in window))return;UI.speechUnlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
function voiceOptions(){const cur=savedVoice()||'default';const vs=goodVoices();return `<option value="default" ${cur==='default'?'selected':''}>Device default voice</option>`+vs.map(v=>`<option value="${esc(v.voiceURI)}" ${cur===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})${vQual(v)===2?' ★':''}</option>`).join('')}
function sayText(q){if(q.say)return q.say;if(q.word)return q.word;return qPlain(q).replace(/\?/g,' what ').replace(/\s+/g,' ').trim()}
function speakQ(q){if(q)speak(sayText(q))}

/* ---------------- question builders ---------------- */
function fk(p,a,b){return p+Math.min(a,b)+'_'+Math.max(a,b)}
function addQ(a,b){if(a!==b&&Math.random()<.5)[a,b]=[b,a];return{op:'+',a,b,ans:a+b,text:`${a} + ${b}`,key:(a<=10&&b<=10)?fk('a',a,b):null}}
function mulQ(a,b){if(Math.random()<.5)[a,b]=[b,a];return{op:'×',a,b,ans:a*b,text:`${a} × ${b}`,key:(a<=12&&b<=12)?fk('m',a,b):null}}
function missingAddQ(a,total){const b=total-a;return{op:'+',a,b,ans:b,missing:true,text:`${a} + ? = ${total}`,mtext:`${a} + □ = ${total}`,key:(a<=10&&b<=10)?fk('a',a,b):null}}

function add3Q(){const x=rnd(1,9),y=10-x,z=rnd(2,9);const nums=shuffle([x,y,z]);return{op:'+3',nums,ans:x+y+z,text:nums.join(' + '),key:null,pair:[x,y],z}}

function skipQ(t){const k=rnd(4,7);let pos=k;if(Math.random()<.35)pos=rnd(2,k-1);const seq=range(1,k).map(i=>i===pos?'□':String(i*t));return{op:'×',a:t,b:pos,ans:t*pos,kind:'skip',text:`Count by ${t}s: ${seq.join(', ').replace('□','?')}`,disp:`Count by ${t}s:<br>${seq.join(', ')}`,long:true,key:fk('m',t,pos)}}

const THINGS=[['🐟','fish'],['🐱','kittens'],['⭐','stars'],['🧶','yarn balls'],['🌸','flowers'],['🎈','balloons'],['🍓','strawberries'],['🐥','chicks'],['🦋','butterflies'],['🍪','cookies']];

function nextQ(hi){const n=rnd(1,hi);return{op:'next',kind:'next',n,ans:n+1,text:`What comes after ${n}?`,disp:`What comes after ${n}?<br>□`,ldisp:`${n} → □`,say:`What number comes after ${n}?`,long:true,small:true,key:null}}

function twoStepQ(){
  const c=catName(),T=[
   ()=>{const a=rnd(2,6),b=rnd(2,6),e=rnd(1,a*b-1);return{w:`${c} has ${a} bags with ${b} fish in each. ${c} eats ${e} of them. How many fish are left?`,ans:a*b-e,h:`First find how many fish: ${a} × ${b}. Then take away ${e}.`,eq:`${a} × ${b} = ${a*b}, then ${a*b} − ${e} = ${a*b-e}`}},
   ()=>{const a=rnd(2,5),b=rnd(3,10),e=rnd(2,15);return{w:`You buy ${a} packs of ${b} stickers. You already had ${e}. How many stickers do you have now?`,ans:a*b+e,h:`First: ${a} × ${b} stickers in the packs. Then add the ${e} you had.`,eq:`${a} × ${b} = ${a*b}, then ${a*b} + ${e} = ${a*b+e}`}},
   ()=>{const k=rnd(2,5),m=rnd(2,6),n=k*m,x=rnd(1,n-1);return{w:`${c} catches ${x} fish and a friend catches ${n-x}. They share them equally between ${k} cats. How many does each cat get?`,ans:m,h:`First add the fish: ${x} + ${n-x}. Then share between ${k}.`,eq:`${x} + ${n-x} = ${n}, then ${n} ÷ ${k} = ${m}`}},
   ()=>{const a=rnd(2,5),b=rnd(2,9),sv=a*b+rnd(1,30);return{w:`You have ${sv} yarn. You buy ${a} hats that cost ${b} yarn each. How much yarn is left?`,ans:sv-a*b,h:`First find the cost: ${a} × ${b}. Then take it away from ${sv}.`,eq:`${a} × ${b} = ${a*b}, then ${sv} − ${a*b} = ${sv-a*b}`}},
   ()=>{const r=rnd(3,8),k=rnd(3,9),e=rnd(1,r*k-1);return{w:`The Cat Concert has ${r} rows of ${k} seats. ${e} seats are empty. How many cats are sitting down?`,ans:r*k-e,h:`First find all the seats: ${r} × ${k}. Then take away the ${e} empty ones.`,eq:`${r} × ${k} = ${r*k}, then ${r*k} − ${e} = ${r*k-e}`}},
   ()=>{const k=rnd(2,6),m=rnd(2,8),g=rnd(2,9);return{w:`${k*m} cupcakes are shared between ${k} cats. Then each cat gets ${g} more. How many cupcakes does each cat have now?`,ans:m+g,h:`First share: ${k*m} ÷ ${k}. Then add ${g}.`,eq:`${k*m} ÷ ${k} = ${m}, then ${m} + ${g} = ${m+g}`}}];
  const t=pick(T)();return{op:'two',kind:'two',ans:t.ans,word:t.w,text:t.w,h:t.h,eq:t.eq,key:null};
}

/* A remembered fact, reshaped so a non-reader can still solve it (null = too big for Little Paws) */
function littleFact(k){const [a,b]=k.slice(1).split('_').map(Number);
  if(k[0]==='a')return a+b>20?null:a+b<=10?picify(addQ(a,b)):addQ(a,b);
  if(k[0]==='s')return a<=20?subQ(a,b):null;
  if(k[0]==='m')return a<=5&&(b<=5||b===10)?lgroupsQ(a,b):b<=5&&a===10?lgroupsQ(b,a):null;
  if(k[0]==='d')return a*b<=20?shareMk(a,b):null;
  return null}

/* ---- decimals (ages 9–10): tenths, hundredths, money, ×10 ÷10 ---- */
const r3=x=>Math.round(x*1000)/1000;

function dOpts(ans,ds,n=4){const out=[ans];for(const v of shuffle(ds.map(r3))){if(out.length>=n)break;if(v>=0&&!out.some(x=>same(x,v)))out.push(v)}for(let k=1;out.length<n;k++){const v=r3(ans+k/10);if(!out.some(x=>same(x,v)))out.push(v)}return out}
function dq(o){o.ans=r3(o.ans);if(o.opts)o.opts=dOpts(o.ans,o.opts,o.two?2:4);
  return Object.assign({op:'dec',dec:true,key:null,long:true,html:true,text:String(o.word||o.disp||'').replace(/<br>/g,' ').replace(/<[^>]+>/g,'')},o)}

function dOrderQ(){const t=rnd(2,8),set=[t/10,(t-1)/10+rnd(1,9)/100,t/100,(t+1)/10].map(r3),small=Math.random()<.5,ans=small?Math.min(...set):Math.max(...set),up=set.slice().sort((x,y)=>x-y);

function dPlaceQ(){const [w,t,h]=shuffle(range(1,9)).slice(0,3),num=(w+t/10+h/100).toFixed(2),pos=pick(['w','t','t','h','h']),d=pos==='w'?w:pos==='t'?t:h,val=pos==='w'?w:pos==='t'?t/10:h/100;

function dX10Q(){const r=rnd(0,3);
  const mk=(x,op,m,ans)=>dq({kind:'dx',ans,disp:`${fd(x)} ${op} ${m} = □`,say:`${fd(x)} ${op==='×'?'times':'divided by'} ${m}`,
    h:op==='×'?`× ${m} makes every digit ${m} times bigger: the digits move ${m===10?'one place':'two places'} to the LEFT.`:`÷ ${m} makes every digit ${m} times smaller: the digits move ${m===10?'one place':'two places'} to the RIGHT.`,

const SOL={sphere:{f:0,e:0,v:0},cube:{f:6,e:12,v:8},cylinder:{f:3,e:2,v:0},cone:{f:2,e:1,v:1},pyramid:{f:5,e:8,v:5},'rectangular prism':{f:6,e:12,v:8},'triangular prism':{f:5,e:9,v:6}};

function blocksSVG(h,t,o,w){const F=34,R=7,RH=34,O=7,G=9;let x=1,s='';

    s+=`<rect x="${x}" y="1" width="${F}" height="${F}" rx="2" fill="#ffc43d" stroke="${NKI}" stroke-width="1.5"/><path d="${p}" stroke="${NKI}" stroke-opacity=".35" stroke-width=".8" fill="none"/>`;x+=F+4}
  if(h)x+=G-4;
  for(let i=0;i<t;i++){let p='';for(let k=1;k<10;k++)p+=`M${x} ${r1(1+k*RH/10)}H${x+R}`;
    s+=`<rect x="${x}" y="1" width="${R}" height="${RH}" rx="1.5" fill="#36c9a0" stroke="${NKI}" stroke-width="1.5"/><path d="${p}" stroke="${NKI}" stroke-opacity=".4" stroke-width=".8" fill="none"/>`;x+=R+3}
  if(t)x+=G-3;
  const cols=Math.min(5,Math.max(1,Math.ceil(o/2)));
  for(let i=0;i<o;i++)s+=`<rect x="${x+(i%cols)*(O+3)}" y="${1+Math.floor(i/cols)*(O+3)}" width="${O}" height="${O}" rx="1.5" fill="#ff6fae" stroke="${NKI}" stroke-width="1.5"/>`;
  const W=Math.max(x+(o?cols*(O+3):0)+1,10),H=F+2;
  return `<svg class="blocks" viewBox="0 0 ${W} ${H}" style="width:${Math.min(Math.round(W*(w||1.5)),310)}px;max-width:100%;height:auto" data-h="${h}" data-t="${t}" data-o="${o}" role="img" aria-label="${h} hundreds, ${t} tens, ${o} ones">${s}</svg>`}

/* ---------------- save migration: map v1 → v2 (multiplication-first) ---------------- */
function migrateMap(x){
  if(!x||x.v!==1||x.mapV===2)return x;
  const o=x.stars||{},n={},g=(id,i)=>o[id+'-'+i]||0;
  const put=(id,i,v)=>{if(v)n[id+'-'+i]=Math.max(n[id+'-'+i]||0,v)};
  if(g('cloud',0))put('cloud',0,g('cloud',0));
  for(let i=0;i<5;i++)put('cloud',i+1,g('cloud',i));put('cloud',6,g('cloud',5));
  for(const i of[0,1,2])put('moon',i,g('moon',i));put('moon',4,g('moon',4));put('moon',5,g('moon',3));if(g('moon',4))put('moon',3,g('moon',4));put('moon',6,g('moon',5));
  for(const i of[0,1,2])put('star',i,g('star',i));put('star',5,g('star',3));if(g('star',3)){put('star',3,g('star',3));put('star',4,g('star',3))}put('star',6,g('star',5));put('library',0,g('star',4));
  for(const i of[0,1,2,3])put('meadow',i,g('meadow',i));put('meadow',4,g('library',3)||g('meadow',4));put('meadow',5,g('library',4));put('meadow',6,g('meadow',5));
  for(let i=0;i<6&&g('lumen',i);i++)put('lumen',i,g('lumen',i));
  for(const id of['cloud','moon','star','meadow']){let last=0;for(let i=6;i>=0;i--){if(n[id+'-'+i])last=1;else if(last)n[id+'-'+i]=1}}
  x.stars=n;x.mapV=2;return x;
}

const BAND_LABEL={little:'Little Paws (ages 4–6): counting to 10, then number bonds and adding, then taking away, then equal groups counted in 2s, 5s and 10s (the start of times tables), then fair sharing (the start of division). Alongside: shapes (circles, triangles, squares, rectangles, counting sides and corners), o’clock and half past on a clock face, and halves. Everything uses pictures and is read aloud. Children tap the pictures to count them, the answer buttons wait a moment so they look first, and a wrong guess starts “count with me” instead of a written hint. Times tables and division appear as groups and sharing, never as × or ÷ sums.',middle:'Middle Paws (ages 7–8): adding and taking away to 20 first, then times tables, sharing and ÷2 ÷5 ÷10, then 2-digit adding and subtracting. New topics sit alongside: 2D and 3D shapes (Block Party Plaza), tens and ones with blocks and hundreds (Treehouse of Tens), time to the quarter hour and five minutes (Cuckoo Clock Cottage) and halves, quarters, thirds and eighths (Fraction Fair). Decimals come later in the map.',big:'Big Paws (ages 9+): times tables and division first. Decimals start after the 3, 4 and 6 tables: tenths (bars, number lines, comparing, adding) in Pawberry Pie Shop, then hundredths, place value, money and ×10 ÷10 in Penny Harbour. Then remainders and two-step problems that mix all four operations. New topics are slotted in: place value, rounding to 10 and 100 (Thousand-Step Mountain), equivalent fractions, comparing, adding fractions and tenths as decimals (Fraction Falls, right after the tenths realm), and elapsed time, a.m. and p.m. (Minute Marathon). Addition and subtraction realms are bonus practice.'};
function realmStarted(r){return REALMS[r].levels.some((_,i)=>S.stars[lid(r,i)])}
function realmList(){const L=BAND_ORDER[band()].map(id=>REALMS.findIndex(R=>R.id===id)).filter(i=>i>=0);REALMS.forEach((_,i)=>{if(!L.includes(i)&&realmStarted(i))L.push(i)});return L}
function realmReq(R){return BAND_REQ[band()][R.id]||R.requires}
function isBonus(R){const b=band();return b==='big'?['meadow','snow','river'].includes(R.id):b==='middle'?['kitten','pond','bunny','ladybird','picnic','hive','shapes','clock','half'].includes(R.id):false}
function realmUnlocked(r){if(realmStarted(r))return true;return realmReq(REALMS[r]).every(id=>{const i=REALMS.findIndex(x=>x.id===id);return !!S.stars[lid(i,REALMS[i].levels.length-1)]})}
function pickStartRealm(){const L=realmList(),ok=i=>realmUnlocked(i)&&currentLevel(i)>=0;let c=L.find(i=>ok(i)&&(!NEW_REALM_IDS.includes(REALMS[i].id)||realmStarted(i)));if(c==null)c=L.find(ok);return c!=null?c:L[0]}

/* Thinking time: how long a child took on a question, measured silently. It starts when the question can first be
   answered and does not count time the tab was hidden or a guide / read-aloud was running. Nothing about it is ever
   shown to the child: no timer, no message. Ages 4-6 ("little") are never timed. */
const SLOW_S={middle:{mc:8,key:12},big:{mc:6,key:10}}; // seconds before a right answer counts as slow, by age band and answer type
const QT_IGNORE_MS=90000,QT_CAP_MS=40000;               // longer than this the child was away (ignored); otherwise capped
function slowLimit(q,mc){const t=SLOW_S[band()];return t?t[mc?'mc':'key']*(q&&q.dec?1.5:1)*1000:0}
function qtHold(){ // pause the clock until the returned function is called (safe to call more than once)
  if(!P||!P.qt)return()=>{};
  const qt=P.qt;if(qt.n++===0)qt.at=Date.now();let done=false;
  return()=>{if(done)return;done=true;if(P&&P.qt===qt&&qt.n>0&&--qt.n===0)qt.total+=Date.now()-qt.at};
}
function qtMs(){const qt=P&&P.qt;if(!qt)return null;const now=Date.now();return Math.max(0,now-qt.t0-qt.total-(qt.n>0?now-qt.at:0))}
let qtHidRel=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!qtHidRel)qtHidRel=qtHold()}else if(qtHidRel){qtHidRel();qtHidRel=null}});
const medianOf=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};

/* spaced repetition: Leitner boxes per fact (days until next review) */
const BOXDAYS=[0,1,2,4,7,14];
function recordFact(q,good,ms){ // ms (optional): thinking time of a first-try right answer
  if(!q||!q.key)return;const t=dayKey();
  const f=S.facts[q.key]||(S.facts[q.key]={box:0,due:t,seen:0,right:0,wrong:0,last:null});
  f.seen++;
  let slow=false;
  if(good&&typeof ms==="number"&&ms>=0&&ms<=QT_IGNORE_MS){
    const lim=slowLimit(q,!!(P&&(P.mc||q.mc)));
    if(lim){const c=Math.min(ms,QT_CAP_MS),ratio=Math.round(Math.min(4,c/lim)*100)/100; // 1 = exactly at the limit
      (f.sl||(f.sl=[])).push(ratio);if(f.sl.length>5)f.sl.shift();f.ls=Math.round(c/1000);slow=ratio>1}
  }
  if(good){f.right++;if(slow){if(f.box===0)f.box=1}else if(f.last!==t||f.box===0)f.box=Math.min(5,f.box+1)} // a slow right answer does not move the fact up
  else{f.wrong++;f.box=Math.max(0,f.box-2)}
  f.last=t;f.due=addDays(t,slow?Math.min(BOXDAYS[f.box],3):BOXDAYS[f.box]); // ...and it comes back sooner
}
function slowFacts(){ // right but slow, again and again
  return Object.entries(S.facts).filter(([,f])=>f.sl&&f.sl.length>=2&&f.right>=2&&f.right>=f.wrong&&medianOf(f.sl)>1)
    .map(([k,f])=>[k,f,medianOf(f.sl)]).sort((a,b)=>b[2]-a[2]).slice(0,8);
}
function dueFacts(){const t=dayKey();return Object.entries(S.facts).filter(([,f])=>f.due<=t).sort((a,b)=>a[1].box-b[1].box).map(e=>e[0])}
function weakFacts(){return Object.entries(S.facts).sort((a,b)=>(a[1].box-b[1].box)||(b[1].wrong-a[1].wrong)).map(e=>e[0])}
function factToQ(k){const [a,b]=k.slice(1).split('_').map(Number);return k[0]==='m'?mulQ(a,b):k[0]==='s'?subQ(a,b):k[0]==='d'?divQ(a,b):addQ(a,b)}
function factLabel(k){const [a,b]=k.slice(1).split('_').map(Number);return k[0]==='m'?`${a} × ${b}`:k[0]==='s'?`${a} − ${b}`:k[0]==='d'?`${a*b} ÷ ${a}`:`${a} + ${b}`}
function crystalLvl(t){let s=0;for(const m of range(1,12)){const f=S.facts[fk('m',t,m)];if(f)s+=Math.min(f.box,3)/3}return s/12}
function crystalsHTML(){

}

function tipSub(q,full){
  const {a,b}=q,d=a-b;
  if(q.kind==='picsub')return full?`${a} take away ${b} leaves ${d}. ${a} − ${b} = ${d}`:(b===0?'Nothing went away! So nothing changes.':'Cover the ones that went away with your finger. Count the ones that are left!');
  if(q.kind==='family')return full?`${d} + ${b} = ${a}, so ${a} − ${b} = ${d}.`:'Adding and taking away are a family. Look at the first fact!';
  if(q.missing)return full?`${a} − ${b} = ${d}, so the missing number is ${b}.`:`Count up from ${d} to ${a}. How many jumps?`;
  if(b===0)return full?`Taking away 0 leaves ${a}.`:'Taking away 0 changes nothing!';
  if(a<=20){
    if(b<=3)return full?`Count back ${b}: ${range(1,b).map(i=>a-i).join(', ')}. So ${a} − ${b} = ${d}.`:`Count back ${b} from ${a}. Start at ${a} and say the numbers going down.`;
    if(a>10&&d===10)return full?`Take away the ${b} ones and you land on 10!`:`${a} has ${a-10} ones. What is left if they all go away?`;
    if(a>10&&d<10){const o=a-10,r=b-o;return full?`${a} − ${o} = 10, then 10 − ${r} = ${d}.`:`Jump back to 10 first: ${a} − ${o} = 10. Then take away ${r} more.`}
    return full?`${b} + ${d} = ${a}, so ${a} − ${b} = ${d}.`:`Think addition: ${b} + ? = ${a}`;
  }
  if(a%10===0&&b%10===0)return full?`${a/10} tens − ${b/10} tens = ${d/10} tens = ${d}.`:`Think in tens: ${a/10} tens take away ${b/10} tens.`;
  if(b<10){const o=a%10;if(b<=o)return full?`Just the ones: ${o} − ${b} = ${o-b}. So ${a} − ${b} = ${d}.`:`Only the ones change: ${o} − ${b} = ?`;return full?`${a} − ${o} = ${a-o}, then ${a-o} − ${b-o} = ${d}.`:`Jump back to ${a-o} first (take away ${o}). Then take away ${b-o} more.`}
  const tb=b-b%10,ob=b%10;
  if(!ob)return full?`${a} − ${tb} = ${d}. Only the tens change!`:`Only the tens change: take away ${tb/10} tens.`;
  return full?`${a} − ${tb} = ${a-tb}, then ${a-tb} − ${ob} = ${d}.`:`Take away the tens first: ${a} − ${tb} = ${a-tb}. Then take away the ${ob} ones.`;
}
function tipDiv(q,full){

  if(q.kind==='half')return full?`Half of ${n} is ${m}, because ${m} + ${m} = ${n}.`:`Half means 2 equal groups. What number doubled makes ${n}?`;
  if(q.kind==='grouping')return full?`Counting in ${k}s: ${range(1,m).map(i=>i*k).join(', ')}. That is ${m} bags!`:`Count in ${k}s until you reach ${n}. How many jumps?`;
  if(q.kind==='rem')return full?`${k} × ${m} = ${k*m}. ${n} − ${k*m} = ${q.r} left over. So ${m} full bags and ${q.r} left over.`:`Count in ${k}s and get as close to ${n} as you can without going over.`;
  if(q.kind==='divflip')return full?`${k} × ${m} = ${n}, so ${n} ÷ ${k} = ${m}.`:'Times and divide are a family. Use the times fact at the top!';
  if(q.missing)return full?`${n} ÷ ${k} = ${m}, so the missing number is ${k}.`:`What number times ${m} makes ${n}?`;
  const T={2:`÷ 2 means half. What is half of ${n}?`,10:`How many tens make ${n}?`,5:`Count in 5s up to ${n}. How many fives?`,4:`Halve ${n}, then halve again!`,3:`Count in 3s up to ${n}.`,9:`Use your 9s: 9 × what = ${n}?`};
  return full?`${k} × ${m} = ${n}, so ${n} ÷ ${k} = ${m}.`:(T[k]||`Think times tables: ${k} × ? = ${n}`);

function tip(q,full){
  if(q.dec||q.nk)return full?q.ex:q.h;

  if(q.kind==='tenplus')return full?`A full ten frame is 10. Then ${range(11,q.ans).join(', ')}. So 10 and ${q.b} more is ${q.ans}!`:`The full frame is 10. Count on from 10: 11, 12…`;
  if(q.kind==='two')return full?q.eq+'.':`Do it in two steps. ${q.h}`;
  if(q.op==='−')return tipSub(q,full);

  if(q.kind==='count')return full?`Let's count together: ${range(1,q.ans).join(', ')}. There are ${q.ans} ${q.thing}!`:'Touch each one with your finger and count out loud. Start at 1!';

  if(q.kind==='more')return full?`${Math.max(q.a,q.b)} is more than ${Math.min(q.a,q.b)}. Its line is longer!`:'Look at the two lines of pictures. Which line is longer?';
  if(q.kind==='picadd')return full?`${q.a} + ${q.b} = ${q.ans}. Count them all: ${range(1,q.ans).join(', ')}!`:`Count the first group: ${q.a}. Then keep counting the next group!`;

  if(q.op==='+3'){const [x,y]=q.pair;return full?`${x} + ${y} = 10, then 10 + ${q.z} = ${q.ans}.`:`Find two numbers that make 10 first — then add the last one!`}

function tipCore(q,full){
  {

      case 10:return full?`${m} tens make ${A}.`:`How much is ${m} tens? (Each ten is 10.)`;
      case 2:return full?`× 2 means double: ${m} + ${m} = ${A}.`:`× 2 means double! What is ${m} + ${m}?`;
      case 5:return full?`10 × ${m} = ${10*m}. Half of that is ${A}.`:`Do 10 × ${m} = ${10*m}, then find half of it.`;
      case 11:return m<=9?(full?`11 × ${m}: the ${m} shows up twice → ${A}.`:`Secret: 11 × a single digit makes that digit show up twice!`):(full?`10 × ${m} = ${10*m}, plus one more ${m} = ${A}.`:`10 × ${m} = ${10*m}. Now add one more ${m}.`);
      case 9:return full?`10 × ${m} = ${10*m}, take away one ${m} → ${A}.`:`10 × ${m} = ${10*m}. Now take away one ${m}.`;
      case 4:return full?`Double, then double again: ${m} → ${2*m} → ${A}.`:`Double, then double again: ${m} → ${2*m} → ?`;
      case 3:return full?`Double ${m} is ${2*m}, plus one more ${m} → ${A}.`:`Double ${m} is ${2*m}. Now add one more ${m}.`;
      case 6:return full?`5 × ${m} = ${5*m}, plus one more ${m} → ${A}.`:`5 × ${m} = ${5*m}. Now add one more ${m}.`;
      case 8:return full?`Double three times: ${m} → ${2*m} → ${4*m} → ${A}.`:`Double three times: ${m} → ${2*m} → ${4*m} → ?`;
      case 12:return full?`10 × ${m} = ${10*m}, plus 2 × ${m} = ${2*m} → ${A}.`:`10 × ${m} = ${10*m}. Now add 2 × ${m} = ${2*m}.`;

function tipAdd(q,full){

  if(q.missing)return full?`${a} + ${b} = ${s}, so the missing number is ${b}.`:`Start at ${a} and count up to ${s}. How many jumps?`;
  const big=Math.max(a,b),small=Math.min(a,b);
  if(big<=10){
    if(a===b)return full?`Double ${a} = ${s}.`:`It's a double! What is double ${a}?`;
    if(big-small===1)return full?`Near double: double ${small} = ${2*small}, plus 1 = ${s}.`:`Near double! Double ${small} = ${2*small}… then add 1.`;
    if(s>10){const need=10-big,left=small-need;return full?`Make 10: ${big} + ${need} = 10, then 10 + ${left} = ${s}.`:`Make 10 first: ${big} + ${need} = 10. Then add the ${left} left over.`}

  }

  return full?`${h} Together: ${T} + ${O} = ${s}.`:`${h} Now put them together!`;
}

  if(q.kind==='more')return `<div class="vis"><div class="morerows" style="font-size:${cs(28)}px"><div><b>${q.a}</b><span>${q.emo.repeat(q.a)}</span></div><div><b>${q.b}</b><span>${q.emo.repeat(q.b)}</span></div></div><div class="cap">The longer line has more!</div></div>`;
  if(q.kind==='picadd')return `<div class="vis"><div class="picadd" style="font-size:${cs(36)}px"><span>${pe(q.emo,q.a,'tc')}</span><b>+</b><span>${pe(q.emo,q.b,'tc')}</span></div><div class="cap">${reveal?`${range(1,q.ans).join(', ')}… ${q.ans} altogether!`:`${q.a} and ${q.b} more`}</div></div>`;
  if(q.kind==='bond'){const t=q.a+q.b;let cells='';for(let i=0;i<t;i++)cells+=`<i class="${i<q.a?'a':reveal?'b':'e tc'}"></i>`;return `<div class="vis"><div class="tfwrap"><div class="tf">${cells}</div></div><div class="cap">${reveal?`${q.a} + ${q.b} = ${t}`:`${q.a} are full. How many are empty?`}</div></div>`}
  if(q.op==='×'){
    if(q.kind==='lgroups'||q.kind==='lskip'){const fs=cs(q.b>=10?17:q.b>=5?22:28);
      return `<div class="vis"><div class="grps">${range(1,q.a).map(i=>`<div class="g1 tc tg" data-size="${q.b}" style="font-size:${fs}px">${pe(q.emo,q.b)}${q.kind==='lskip'&&(i<q.a||reveal)?`<small class="gl">${i*q.b}</small>`:''}</div>`).join('')}</div><div class="cap">${reveal?range(1,q.a).map(i=>i*q.b).join(', '):`${q.a} group${q.a>1?'s':''} of ${q.b}`}</div></div>`}
    if(q.kind==='groups')return `<div class="vis"><div class="grps">${range(1,q.a).map(()=>`<div class="g1 tc tg" data-size="${q.b}">${q.emo.repeat(q.b)}</div>`).join('')}</div><div class="cap">${q.a} groups of ${q.b} → ${q.a} × ${q.b}</div></div>`;
    if(q.kind==='split'){const t=q.a-q.a%10,o=q.a%10,m=q.b;return `<div class="vis"><div class="area"><div class="ar" style="flex:${t}"><b>${t} × ${m}</b>${reveal?`<span>= ${t*m}</span>`:''}</div><div class="ar o" style="flex:${Math.max(o,3)}"><b>${o} × ${m}</b>${reveal?`<span>= ${o*m}</span>`:''}</div></div><div class="cap">${q.a} = ${t} + ${o}</div></div>`}
    if(q.kind==='tens'||q.kind==='skip')return '';
    if(q.missing&&!reveal)return '';

    if(r*c<=40){const fs=cs(c>8?16:c>5?20:24);
      return `<div class="vis"><div class="arr" style="font-size:${fs}px">${Array.from({length:r},()=>`<div>${'🐱'.repeat(c)}</div>`).join('')}</div><div class="cap">${r} row${r>1?'s':''} of ${c}</div></div>`}
    if(c>15)return '';
    const split=c>10?10:(c>5?5:0);let cells='';
    for(let i=0;i<r;i++)for(let j=0;j<c;j++)cells+=`<i class="${split&&j>=split?'b':''}"></i>`;
    return `<div class="vis"><div class="dots" style="grid-template-columns:repeat(${c},var(--d))">${cells}</div><div class="cap">${r} rows of ${c}${split?` → ${r} × ${split} and ${r} × ${c-split}`:''}</div></div>`;
  }
  if(q.op==='+'&&(!q.missing||reveal)&&q.a<=10&&q.b<=10){
    const tot=q.a+q.b,frames=tot>10?2:1;let html='',k=0;
    for(let f=0;f<frames;f++){let cells='';for(let i=0;i<10;i++,k++)cells+=`<i class="${k<q.a?'a tc':k<tot?'b tc':''}"></i>`;html+=`<div class="tf">${cells}</div>`}
    return `<div class="vis"><div class="tfwrap">${html}</div><div class="cap"><span class="ca">${q.a}</span> + <span class="cb">${q.b}</span></div></div>`;
  }
  if(q.op==='+'&&(!q.missing||reveal)){
    const g=(n,cls)=>`<div class="grp ${cls}">${'<i class="rod"></i>'.repeat(Math.floor(n/10))}${'<i class="cube"></i>'.repeat(n%10)}</div>`;
    return `<div class="vis"><div class="b10">${g(q.a,'ga')}<span class="plus">+</span>${g(q.b,'gb')}</div><div class="cap">tall sticks = tens · little cubes = ones</div></div>`;
  }
  return '';
}
/* decimal pictures: tenth bars, hundred squares, number lines, place-value chart */
function dBars(n,extra=0,cross=0){const tot=n+extra,bars=Math.max(1,Math.ceil(tot/10));let h='';
  for(let b=0;b<bars;b++){let c='';for(let i=0;i<10;i++){const k=b*10+i;c+=`<i class="${k<n?(k>=n-cross?'on x':'on'):k<tot?'on2':''}"></i>`}h+=`<div class="dbar">${c}</div>`}
  return `<div class="dbars">${h}</div>`}
function dLineSVG(q,reveal){const W=340,x0=20,st=30,y=56;let s=`<line x1="${x0}" y1="${y}" x2="${x0+10*st}" y2="${y}" stroke="#3b2a4f" stroke-width="3" stroke-linecap="round"/>`;
  for(let i=0;i<=10;i++){const x=x0+i*st,b=i%5===0;s+=`<line x1="${x}" y1="${y-(b?13:8)}" x2="${x}" y2="${y+(b?13:8)}" stroke="#3b2a4f" stroke-width="${b?3:2}"/>`;
    if(i%10===0||(reveal&&i===5))s+=`<text x="${x}" y="${y+34}" text-anchor="middle" font-size="18" font-weight="800" fill="#3b2a4f">${fd(q.lo+i/10)}</text>`}
  const px=x0+q.k*st;
  if(reveal)for(let i=1;i<=q.k;i++)s+=`<path d="M${x0+(i-1)*st} ${y-5} Q${x0+(i-.5)*st} ${y-24} ${x0+i*st} ${y-5}" fill="none" stroke="#36c9a0" stroke-width="2.5"/>`;
  s+=`<path d="M${px-9} ${y-36} L${px+9} ${y-36} L${px} ${y-18} Z" fill="#ff6fae"/>`;
  if(reveal)s+=`<text x="${px}" y="${y-42}" text-anchor="middle" font-size="18" font-weight="800" fill="#d94a8c">${fd(q.ans)}</text>`;
  return `<svg viewBox="0 0 ${W} 100" width="${cs(W)}" style="max-width:100%" role="img" aria-label="Number line from ${q.lo} to ${q.lo+1}">${s}</svg>`}
function pvChart(num){const [w,d]=num.split('.');return `<div class="vis"><table class="pv"><tr><th>Ones</th><th></th><th>Tenths</th><th>Hundredths</th></tr><tr><td>${w}</td><td>.</td><td>${d[0]}</td><td>${d[1]}</td></tr></table></div>`}
function decVis(q,reveal){
  if(q.novis&&!reveal)return '';
  const cap=t=>`<div class="cap">${t}</div>`;
  switch(q.kind){
    case 'dbar':return `<div class="vis">${dBars(q.n)}${cap(reveal?`${q.n} tenths = ${fd(q.n/10)}`:'1 bar = 1 whole')}</div>`;
    case 'dadd':return q.A+q.B<=40?`<div class="vis">${dBars(q.A,q.B)}${cap(`${q.A} tenths + ${q.B} tenths`)}</div>`:'';
    case 'dsub':return q.A<=40?`<div class="vis">${dBars(q.A,0,q.B)}${cap(`${q.A} tenths take away ${q.B} tenths`)}</div>`:'';
    case 'dgrid':{let c='';for(let i=0;i<100;i++)c+=`<i class="${i<q.n?'on':''}"></i>`;return `<div class="vis"><div class="dgrid">${c}</div>${cap(reveal?`${q.n} hundredths = ${fd(q.n/100)}`:'1 big square = 1 whole')}</div>`}
    case 'dline':return `<div class="vis">${dLineSVG(q,reveal)}</div>`;
    case 'dplace':return reveal?pvChart(q.num):'';
  }
  return '';
}
function plainEq(q){if(q.dec||q.nk)return q.eqs;if((q.kind==='lgroups'||q.kind==='lskip')&&band()==='little')return `${q.a>1?Array(q.a).fill(q.b).join(' + '):q.b} = ${q.ans}`;if(q.kind==='two')return q.eq;if(q.kind==='rem')return `${q.a} ÷ ${q.b} = ${q.full} r ${q.r}`;if(q.kind==='half')return `Half of ${q.a} = ${q.res}`;if(q.res!=null)return `${q.a} ${q.op} ${q.b} = ${q.res}`;if(q.kind==='count')return `${q.ans} ${q.thing}`;if(q.kind==='next')return `${q.n} → ${q.ans}`;if(q.kind==='more')return `${q.ans} is more`;if(q.kind==='groups')return `${q.a} × ${q.b} = ${q.ans}`;if(q.op==='+3')return `${q.nums.join(' + ')} = ${q.ans}`;return `${q.a} ${q.op} ${q.b} = ${q.op==='×'?q.a*q.b:q.a+q.b}`}
function qPlain(q){if(band()==='little'&&q.ldisp)return q.ldisp.replace(/<br>/g,' ').replace('□','?');if(q.disp)return q.disp.replace(/<br>/g,' ').replace(/<[^>]+>/g,'').replace('□','?');return q.missing?q.text:q.text+' = ?'}
function choicesFor(q){
  if(q.opts)return shuffle(q.opts.slice());
  if(q.kind==='more')return shuffle([q.a,q.b]);
  if(q.small){const set=new Set([q.ans]);for(const v of shuffle([q.ans+1,q.ans-1,q.ans+2,q.ans-2,q.ans+3])){if(set.size>=4)break;if(v>=0&&v!==q.ans)set.add(v)}let k=4;while(set.size<4)set.add(q.ans+k++);return shuffle([...set])}
  const ans=q.ans,set=new Set([ans]);
  const c=(q.op==='×'&&!q.missing)?[(q.a+1)*q.b,(q.a-1)*q.b,q.a*(q.b+1),q.a*(q.b-1),ans+1,ans-1,q.a+q.b]:q.op==='−'?[ans+1,ans-1,ans+10,ans-10,ans+2,ans-2,q.a+q.b]:q.op==='÷'?[ans+1,ans-1,ans+2,ans-2,q.b,ans*2]:[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10];
  for(const v of shuffle(c)){if(set.size>=4)break;if(v>0&&v!==ans)set.add(v)}
  let k=3;while(set.size<4)set.add(ans+k++);
  return shuffle([...set]);
}

let UI={screen:'home',tab:'map',realm:0,albumTab:'stickers',onboard:0,dcolor:'#3b2a4f',dsize:14,dstamp:null,draft:null,nudged:false};

function setTheme(id){const t=THEMES[id]||THEMES.home;document.body.style.backgroundImage=t[0];document.body.classList.toggle('dark',!!t[1])}

function render(){
  app.classList.toggle('playing',UI.screen==='play');
  if(!S.name)return renderOnboard();
  if(UI.pin&&UI.pin.ctx==='change'){setTheme('home');app.innerHTML=pinHTML();return}
  if(needsSetup())return renderSetup();
  if(UI.screen==='play'&&P)return renderPlay();
  setTheme(UI.tab==='map'?REALMS[UI.realm].theme:'home');
  let body='';
  if(UI.tab==='map')body=mapView();
  else if(UI.tab==='practice')body=practiceView();
  else if(UI.tab==='closet')body=closetView();
  else if(UI.tab==='album')body=albumView();
  else if(UI.tab==='draw')body=drawView();
  else if(UI.tab==='parents')body=parentsView();
  else if(UI.tab==='friends'&&friendsOn())body=friendsView();
  app.innerHTML=topBar()+body+tabsNav();
  if(UI.tab==='draw')initStudio();
}

function scAnim(e,i){return SC_ANIM[e]||['bob','sway','bob'][i%3]}
function groundSVG(g,c){

  else if(g==='waves'){const w=(y,a)=>{let d=`M0 ${y}`;for(let x=0;x<W;x+=50)d+=` Q${x+25} ${y-a} ${x+50} ${y}`;return d+` V${H} H0Z`};p=`<path d="${w(112,12)}" fill="${c}" opacity=".5"/><path d="${w(126,10)}" fill="${c}"/>`}

  else if(g==='clouds')p=[0,1].map(l=>Array.from({length:9},(_,i)=>`<circle cx="${i*50+(l?25:0)}" cy="${l?150:134}" r="${32+rnd2(i+l*9)*10}" fill="${c}" opacity="${l?1:.7}"/>`).join('')).join('');
  else if(g==='trees')p=Array.from({length:16},(_,i)=>{const x=i*26-6,h=42+rnd2(i)*38;return `<path d="M${x} 150 L${x+15} ${150-h} L${x+30} 150 Z" fill="${c}"/>`}).join('')+`<rect x="0" y="138" width="400" height="12" fill="${c}"/>`;
  else if(g==='cave')p=`<path d="M0 0 H400 V14 ${Array.from({length:12},(_,i)=>`L${i*34+17} ${22+rnd2(i)*30} L${i*34+34} 14`).join(' ')} Z" fill="${c}"/><path d="M0 130 ${Array.from({length:10},(_,i)=>`L${i*40+20} ${112-rnd2(i+3)*22} L${i*40+40} 130`).join(' ')} V150 H0Z" fill="${c}"/>`;
  else if(g==='city')p=Array.from({length:11},(_,i)=>{const x=i*37,h=36+rnd2(i)*46,w=30;return `<rect x="${x}" y="${150-h}" width="${w}" height="${h}" fill="${c}"/>${i%3===1?`<path d="M${x-6} ${150-h} L${x+w/2} ${150-h-16} L${x+w+6} ${150-h} Z" fill="${c}"/>`:''}${[0,1].map(r=>`<rect x="${x+8}" y="${150-h+10+r*16}" width="6" height="7" fill="#ffd56b" opacity=".85"/>`).join('')}`}).join('');
  return `<svg class="sc-ground" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${p}</svg>`}
function sceneHTML(ri,open){
  const R=REALMS[ri],sc=SCENES[R.id];if(!sc)return '';

    ${open?'':'<span class="sc-lock">🔒</span>'}</div>`}
function pathDecor(R,pts,W,gap){const sc=SCENES[R.id];if(!sc)return '';const s=SC();
  return pts.map((pt,i)=>{if(i===pts.length-1)return '';const e=sc.d[(i*2+1)%sc.d.length],side=pt.x>W/2?-1:1,x=Math.max(22*s,Math.min(W-22*s,W/2+side*118*s+(i%2?8:-8)*s)),y=pt.y+gap*.5;
    return `<span class="sc-d sc-${scAnim(e,i)} pdec" style="left:${x}px;top:${y}px;font-size:${cs(30)}px;animation-delay:${-i*.9}s">${e}</span>`}).join('')}
function mapView(){

function pathHTML(ri){
  const sc=SC(),R=REALMS[ri],n=R.levels.length,W=Math.round(320*sc),gap=Math.round(116*sc),H=n*gap+Math.round(40*sc);
  const pts=R.levels.map((_,i)=>({x:Math.round(W/2+Math.sin(i*1.25+0.3)*92*sc),y:Math.round(56*sc)+i*gap}));
  const d=pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');
  const cur=currentLevel(ri);
  let s=`<div class="path" style="width:${W}px;height:${H}px">${pathDecor(R,pts,W,gap)}<svg class="trail" width="${W}" height="${H}"><path d="${d}" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 22"/></svg>`;
  R.levels.forEach((L,i)=>{
    const st=S.stars[lid(ri,i)]||0,open=levelUnlocked(ri,i);
    const cls=['node',L.boss?'boss':'',st?'done':'',i===cur?'current':'',open?'':'locked'].join(' ');

    s+=`<button class="${cls}" style="left:${pts[i].x}px;top:${pts[i].y}px" data-act="start" data-r="${ri}" data-l="${i}" ${open?'':'disabled'} aria-label="Level ${i+1}: ${L.name}">${label}<span class="st">${starStr(st)}</span><span class="lname">${L.name}</span></button>`;

  });
  return s+'</div>';
}

function moveCard(m){const own=!m.price||S.owned.includes('mv_'+m.id),on=winMove()===m.id;return `<div class="item ${on?'worn':''}">${on?'<div class="wintag">🎉 Win dance</div>':''}<div class="ie">${m.e}</div><div class="in">${m.name}</div><div class="row" style="gap:6px"><button class="chip" data-act="mvTry" data-id="${m.id}" aria-label="Watch ${m.name}">▶</button>${own?`<button class="chip ${on?'on':''}" data-act="mvEquip" data-id="${m.id}">${on?'✓ Using':'Use'}</button>`:`<button class="chip" data-act="mvBuy" data-id="${m.id}">🧶 ${m.price}</button>`}</div></div>`}

function chooseFur(id){

function itemAction(id){

let studio=null;
function setupDraw(cv,tool,onStart,onEnd){
  const ctx=cv.getContext('2d');let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const t=tool(),p=pos(e);onStart&&onStart();
    if(t.stamp){ctx.font=`${t.size*4+20}px "Segoe UI Emoji","Apple Color Emoji",serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.stamp,p.x,p.y);onEnd&&onEnd();return}
    drawing=true;last=p;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=t.color;ctx.lineWidth=t.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e),t=tool();ctx.strokeStyle=t.color;ctx.lineWidth=t.size;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
  const end=()=>{if(drawing){drawing=false;onEnd&&onEnd()}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return ctx;
}
function initStudio(){
  const cv=$('#cv');if(!cv)return;
  const undo=[];
  const ctx=setupDraw(cv,()=>({color:UI.dcolor,size:UI.dsize,stamp:UI.dstamp}),

    ()=>{UI.draft=cv.toDataURL()});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,600,600);
  if(UI.draft){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=UI.draft}
  studio={cv,ctx,undo};updateTools();
}
function updateTools(){

function heat(prefix,max,kf){

  return h+'</table>';
}

   <p class="tiny" style="margin-top:6px">To play on another device, open the game there and type the same name <b>${esc(S.name)}</b>. They'll also need the 4-number secret code. Sign out keeps the cloud save; Start over erases it on this device and in the cloud.</p></div>
  <h3 class="sub">How the game is designed</h3><div class="notes"><ul style="padding-left:18px;margin:0">
   <li><b>Shapes, place value, time and fractions.</b> Four more topics each have their own maps, shown to the ages that meet them in the Australian Curriculum. <i>Shapes</i>: Shape Village (ages 4–6: finding, counting sides and corners, odd one out) and Block Party Plaza (7–8: seven flat shapes, then cubes, cones, spheres and prisms). <i>Place value</i>: Treehouse of Tens (7–8: bundles and blocks, tens and ones, partitioning, hundreds, comparing and ordering) and Thousand-Step Mountain (9+: thousands, words, expanded form, rounding to the nearest 10 and 100). <i>Time</i>: Tick-Tock Tower (4–6: o’clock and half past), Cuckoo Clock Cottage (7–8: quarter past and to, every 5 minutes) and Minute Marathon (9+: to the minute, a.m. and p.m., minutes between times). <i>Fractions</i>: Pizza Pawty (4–6: equal parts and half), Fraction Fair (7–8: halves, quarters, thirds, fifths, eighths, fractions of a group, number lines) and Fraction Falls (9+: equivalent fractions, comparing, adding with the same denominator, tenths as decimals). They follow the same pictures-first path (blocks, clock faces and cut-up shapes first, then the symbols), use tap-the-answer for anything that is not a number, and earn stars, stickers, badges and the bonus game like every other map.</li>
   <li><b>Four-operation quest.</b> 29 maps and about 200 levels cover counting, addition, subtraction, multiplication and division, in the usual teaching order. Each operation starts with pictures (taking away, fair sharing, equal groups), then strategies (count back, jump to 10, think addition, × facts turned around), then 2-digit work, remainders and two-step stories that mix all four. Every addition, subtraction, times and division fact has its own memory box. Each times table also has a crystal that lights up as its facts become strong over several days.</li>
   <li><b>Age sets the difficulty.</b> Ages 4–6 (Little Paws) start with counting, adding to 10, taking away and fair sharing. Everything has pictures, tap-the-answer choices, 6-question levels and questions read aloud. Ages 7–8 (Middle Paws) start with adding and taking away to 20, then times tables, ÷2 ÷5 ÷10 and 2-digit work. Ages 9+ (Big Paws) start with times tables and division, then remainders and mixed two-step problems. Stars already earned stay unlocked if the age is changed.</li>
   <li><b>Secret code.</b> Each player picks a 4-number code that is asked when signing in by name, so brothers, sisters and friends can't open each other's game by accident. It's a kid-proof lock, not bank-grade security.</li>
   <li><b>Calm music and celebrations.</b> Soft background music made live in the browser (tap 🎵 to turn it off), a cheerful jingle when a lesson ends, and dance moves for the cat bought with yarn.</li>
   <li><b>Spaced repetition.</b> Every addition and times-table fact sits in its own memory box. Facts she gets right come back after 1, 2, 4, 7 then 14 days. Facts she misses come back sooner. Due facts are mixed into levels and the Review Garden.</li>
   <li><b>Retrieval and interleaving.</b> She types answers from memory, not just picks them. Older facts are mixed in with new ones, which builds longer-lasting memory than practising one table at a time.</li>
   <li><b>The right amount of challenge (~85% success).</b> Each realm starts with picture-supported multiple choice, then moves to recall. The first miss gives a clue. A second miss shows a worked picture explanation, and the same question comes back later in the level.</li>
   <li><b>Concrete → pictorial → abstract</b> (Singapore maths). Cat arrays, ten-frames and tens-and-ones blocks show <i>why</i> the answer works.</li>
   <li><b>Strategies, not just memorising.</b> Make-10, doubles and near doubles, ×9 = ×10 − 1, ×4 = double double, ×7 = ×5 + ×2.</li>
   <li><b>Growth-mindset feedback</b> (Dweck). Praise is for effort, strategy and fixing mistakes, never "you're so clever". Mistakes are shown as how brains grow.</li>
   <li><b>No time pressure by default</b> (Boaler: timed tests drive maths anxiety). Lightning Paws is optional. Players can race their personal best and view shared high scores.</li>
   <li><b>Self-Determination Theory.</b> Autonomy (she picks the realm, table and outfit), competence (stars, mastery bars) and relatedness (a named cat companion who cheers her on).</li>
   <li><b>"Candy Crush" loop, made kind.</b> She gets short 2–4 minute levels, 3-star ratings, a level map, combos, mystery gifts, a sticker collection and a daily gift. There are <b>no</b> lives, no losing, no ads and no purchases. A missed day is forgiven by a "cat nap", and a break reminder pops up after a set time.</li>
   <li><b>Bonus game, earned not given.</b> Treat Tumble (a catch-the-treats game, no maths) is won by finishing a whole map: every level, including the guardian at the end. Each map gives one play, the first time it is finished, so it can't be farmed by replaying. A round lasts about a minute. ${S.bonus&&S.bonus.plays?`Played ${S.bonus.plays} time${S.bonus.plays>1?'s':''} so far, best score ${S.bonus.best}.`:''}</li>
   <li><b>Halving Slice, in Practice any time.</b> Numbers fall down the screen and a swipe cuts one in half; each half hops up and can be cut again. It is tuned by age: Little Paws halve even numbers up to 20 into whole numbers (8 → 4 + 4), Middle Paws go up to 50 with halves like 7 → 3.5, and Big Paws go up to 100 and down to thousandths (3.5 → 1.75 → 0.875). Orders ask for one exact half, so players work out halving chains. A round lasts a minute. ${S.bonus&&S.bonus.hbPlays?`Played ${S.bonus.hbPlays} time${S.bonus.hbPlays>1?'s':''} so far, best score ${S.bonus.hbBest}.`:''}</li>
   <li><b>Win dance.</b> Dance moves bought with yarn can be picked as the cat's win dance in the Closet. It plays at the end of every level.</li>
   <li><b>Tips:</b> 10–15 minutes a day works better than one long session. Ask her to teach <i>you</i> a strategy. Celebrate effort and the tricky facts she conquers.</li>
  </ul></div>`;
}

/* ---------------- practice game: Halving Slice ----------------
   Always open in Practice, because every cut is a halving sum. Numbers fall; a swipe cuts one into two halves
   that hop apart and keep falling, so each half can be cut again: 8 → 4 + 4, 7 → 3.5 + 3.5, 3.5 → 1.75 + 1.75.
   A piece shatters into a treat instead of splitting once it has been cut too often for the band, or when its
   half would need more decimal places than the band allows. Orders ask for one exact half (6.25, say), so the
   player has to spot which falling number halves down to it.
   Each finger is its own blade: a cut only joins points from the same finger, so holding two fingers down can't
   draw a line between them, and a jump too long to be a real swipe doesn't cut. */

function hbLoop(now){const T=HS;if(!T||!T.run)return;if(T.paused){T.last=now;return requestAnimationFrame(hbLoop)}

    c.lineWidth=3;c.strokeStyle='#22304a';c.beginPath();c.arc(0,0,p.r,0,7);c.stroke();
    const s=String(r3(p.v)),fs=Math.min(p.r*1.0,p.r*2.7/Math.max(1,s.length));

    c.globalAlpha=Math.min(1,f.life*2);if(f.e){c.font=`${Math.round(T.R*.6)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(f.e,f.x,f.y)}else{c.fillStyle=f.col;c.beginPath();c.arc(f.x,f.y,3.5,0,7);c.fill()}c.globalAlpha=1}
  if(T.trail.length>1){const fire=T.pow.fire>T.t;c.lineCap='round';c.lineJoin='round';c.shadowColor=fire?'#ff7a1a':'#9fd0ff';c.shadowBlur=14;
    for(let i=1;i<T.trail.length;i++){const a=T.trail[i-1],b=T.trail[i];if(a.id!==b.id)continue;const k=1-(T.t-b.t)/.16;c.strokeStyle=fire?`rgba(255,190,90,${k})`:`rgba(255,255,255,${k})`;c.lineWidth=2+k*9;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}c.shadowBlur=0}
