<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Whisker">
<meta name="theme-color" content="#ffe4f1">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Whisker Academy — a maths adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2a4f; --muted:#7a6990; --line:#efe3f7;
  --pink:#ff6fae; --pink-d:#d94a8c; --mint:#36c9a0; --mint-d:#22a37f; --sun:#ffc43d; --sun-d:#e09b12;
  --shadow:0 5px 0 rgba(59,42,79,.10),0 10px 24px rgba(59,42,79,.10);
  --font:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --d:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#fff3f8}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);background-image:linear-gradient(180deg,#ffe4f1,#fff8ef);background-attachment:fixed;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid #7cc7ff;outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:640px;margin:0 auto;padding:12px 14px 112px;min-height:100vh}
#app.playing{padding-bottom:16px}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tiny{font-size:14px;color:var(--muted)}
.sec{font-size:30px;margin:16px 4px 10px}
.sub{font-size:20px;margin:18px 4px 8px}
.card{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pink);color:#fff;font-weight:800;font-size:20px;padding:8px 22px;min-height:52px;border-radius:18px;box-shadow:0 5px 0 var(--pink-d);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.sun{background:var(--sun);color:#5a3b00;box-shadow:0 5px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e2d4ee}
.btn.big{font-size:24px;padding:10px 34px;min-height:60px}
.btn:disabled{opacity:.45}
.chip{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #e2d4ee;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#ffe1ef;box-shadow:0 3px 0 #ffb3d4;color:var(--pink-d)}
.chip:disabled{opacity:.45}

/* top bar */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:2px 14px 2px 2px;box-shadow:var(--shadow)}
.me .nm{font-weight:800;font-size:17px;line-height:1}
.me .rk{font-size:12px;color:var(--muted);line-height:1.2}
.pill{background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:18px;box-shadow:var(--shadow);display:inline-flex;gap:4px;align-items:center;white-space:nowrap;min-height:40px}
.pill.pop{animation:pop .35s}
.gear{font-size:18px}

/* cat */
.cat{position:relative;display:inline-block;flex:none}
.cat svg{position:relative;z-index:1;width:100%;height:100%;display:block;overflow:visible}
.cat .acc{position:absolute;z-index:2;line-height:1;pointer-events:none}
.cat .acc.behind{z-index:0}
.petbtn{border-radius:50%}
.petbtn:active .cat{transform:scale(.94)}
.cat.bounce{animation:bounce .5s}
.cat.idle svg{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 90%}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:2px solid var(--line);z-index:20}
nav.tabs button{flex:1;max-width:116px;padding:4px 2px;border-radius:16px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;color:var(--muted)}
nav.tabs .i{font-size:27px;line-height:1.15}
nav.tabs button.on{background:#ffe3f1;color:var(--pink-d)}
nav.tabs .badge{position:absolute;margin-left:28px;margin-top:-2px;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}

/* companion & map */
.companion{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.bubble{position:relative;background:#fff;border-radius:20px;padding:10px 14px;font-size:17px;font-weight:600;box-shadow:var(--shadow);line-height:1.3;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bubble.small{font-size:16px;padding:8px 12px;min-height:44px}
.rankbar{background:rgba(255,255,255,.85);border-radius:16px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.meter{flex:1;height:14px;background:#f1e8f8;border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ff9fca);border-radius:99px}
.realm-head{display:flex;align-items:center;gap:8px;margin:16px 0 2px}
.realm-head h1{font-size:28px;flex:1;text-align:center}
.arrow{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:20px;flex:none}
.arrow:disabled{opacity:.35}
.realm-dots{display:flex;justify-content:center;gap:6px;margin:6px 0}
.realm-dots button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);font-size:20px}
.realm-dots button.on{background:#fff;box-shadow:0 0 0 3px var(--pink)}
.realm-dots button.lock{filter:grayscale(1);opacity:.5}
.realm-intro{text-align:center;font-size:16px;margin:2px 12px 0;color:var(--muted)}
.realm-track{text-align:center;font-size:14px;font-weight:800;color:var(--pink-d);letter-spacing:.04em;text-transform:uppercase}
body.dark .realm-head h1, body.dark .realm-intro{color:#fff}
body.dark .realm-track{color:#ffd36b}
.path{position:relative;margin:4px auto 0}
.path svg.trail{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid #fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(59,42,79,.18);color:var(--ink)}
.node.done{background:var(--sun)}
.node.current{background:var(--pink);color:#fff;animation:pulse 1.6s infinite}
.node.locked{background:#ebe5f1;color:#b4aac2;font-size:24px}
.node.boss{width:98px;height:98px;font-size:44px}
.node.boss.locked{font-size:30px}
.node .st{position:absolute;bottom:-14px;font-size:17px;letter-spacing:-1px;color:#ffb400;text-shadow:0 2px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}
.node .lname{position:absolute;top:calc(100% + 12px);white-space:nowrap;font-size:13px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);padding:0 8px;border-radius:8px}
.you{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation:hop 1.4s ease-in-out infinite}
.lockcard{text-align:center;margin:24px 0}
.lockcard .big{font-size:64px}

/* practice */
.pcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.pcard.col{flex-direction:column;align-items:stretch}
.pcard .pi{font-size:42px;width:56px;text-align:center;flex:none}
.pcard h3{font-size:22px}
.pcard p{font-size:15px;color:var(--muted);line-height:1.3}
.pcard .grow{flex:1}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tbtn{background:#fff6fb;border-radius:16px;box-shadow:0 3px 0 #f2d6e6;padding:8px 4px;font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.tbtn small{font-size:12px;color:var(--muted);font-weight:700}
.minibar{width:80%;height:6px;background:#f0e6f6;border-radius:9px;overflow:hidden;margin-top:3px}
.minibar i{display:block;height:100%;background:var(--mint)}

/* closet */
.closet-hero{display:flex;align-items:center;gap:16px;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:14px 18px}
.catname{font-size:28px;font-weight:800}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.sw{background:#fff;border-radius:18px;padding:8px 4px;box-shadow:0 3px 0 #e8dcf2;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px}
.sw .dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink)}
.sw.on{box-shadow:0 0 0 3px var(--pink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.item .ie{font-size:42px;line-height:1.1}
.item .in{font-weight:700;font-size:15px;line-height:1.1}
.item.worn{box-shadow:0 0 0 3px var(--mint),var(--shadow)}
.item .chip{font-size:15px;min-height:40px}

/* album */
.seg{display:flex;background:#fff;border-radius:18px;padding:4px;gap:4px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:14px;font-weight:700;font-size:15px;min-height:44px}
.seg button.on{background:#ffe1ef;color:var(--pink-d)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stk{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;position:relative;border:4px solid #fff}
.stk span{font-size:44px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(59,42,79,.15))}
.stk small{font-size:13px;font-weight:700;text-align:center;line-height:1.1}
.stk.r-r{border-color:#9ad8ff}
.stk.r-l{border-color:#ffd256;background:linear-gradient(180deg,#fff9e0,#fff)}
.stk.empty{background:#f6f1fa;box-shadow:none}
.stk.empty span{color:#cfc3dd;font-weight:800;filter:none}
.stk .cnt{position:absolute;top:4px;right:8px;font-size:12px;color:var(--muted)}
.stk.big{width:110px;padding:14px}
.stk.big span{font-size:64px}
.drawings{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.drawings button{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#fff;aspect-ratio:1}
.drawings img{width:100%;height:100%;object-fit:cover;display:block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bdg{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px;text-align:center}
.bdg .be{font-size:36px}
.bdg b{display:block;font-size:15px}
.bdg small{font-size:12px;color:var(--muted);line-height:1.1;display:block}
.bdg.off{background:#f6f1fa;box-shadow:none;opacity:.7}
.bdg.off .be{filter:grayscale(1);opacity:.4}
.empty-note{text-align:center;color:var(--muted);padding:30px 10px;font-size:17px}

/* studio */
.challenge .chl{font-weight:800;color:var(--pink-d);font-size:15px}
.challenge .cht{font-size:20px;font-weight:700;line-height:1.25;margin:2px 0 8px}
.challenge .chq{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:17px}
.smallin{width:80px;height:44px;border-radius:14px;border:3px solid #ead9f5;font-size:22px;font-weight:800;text-align:center;color:var(--ink)}
.ok{color:var(--mint-d)}
.studio{margin-top:14px}
#cv{width:100%;max-width:560px;aspect-ratio:1;display:block;margin:0 auto;background:#fff;border-radius:24px;box-shadow:var(--shadow);touch-action:none;cursor:crosshair}
.tools{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.colr{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.colr.on{box-shadow:0 0 0 4px var(--ink)}
.size i{display:inline-block;border-radius:50%;background:var(--ink)}

/* play */
.play{display:flex;flex-direction:column;gap:10px}
.play-top{display:flex;gap:10px;align-items:center}
.xbtn{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px;font-weight:800;flex:none}
.prog{flex:1;height:22px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#3ccfa5,#9be8a8);border-radius:999px;transition:width .45s}
.timer{height:14px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9a5a,var(--sun))}
.coach{display:flex;align-items:center;gap:8px}
.combo{font-weight:800;font-size:18px;color:#ff7a1a;background:#fff;border-radius:999px;padding:4px 12px;box-shadow:var(--shadow);opacity:0;transform:scale(.6);transition:all .25s;white-space:nowrap}
.combo.on{opacity:1;transform:scale(1)}
.combo.bump{animation:pop .35s}
.qcard{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:14px 14px 16px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.qlabel{font-size:14px;font-weight:700;color:var(--muted)}
.tag{background:#e3f8ef;color:var(--mint-d);border-radius:99px;padding:0 8px;margin-left:4px}
.word{font-size:21px;font-weight:600;line-height:1.3}
.qtext{font-size:clamp(42px,11vw,62px);font-weight:800;line-height:1.05;white-space:nowrap}
.wordans{font-size:30px}
.ans{display:inline-block;min-width:1.5em;padding:0 .18em;border-radius:16px;background:#fff0f7;color:var(--pink-d);border:3px dashed #ffb7d6}
.ans.reveal{background:#e3f8ef;border-color:#9fe3c8;color:var(--mint-d)}
.ans.right{background:#e3f8ef;border:3px solid var(--mint);color:var(--mint-d)}
.helpers{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:58px;font-size:30px;font-weight:800;background:#fff;border-radius:18px;box-shadow:0 5px 0 #e2d4ee}
.keypad button:active{transform:translateY(4px);box-shadow:0 1px 0 #e2d4ee}
.keypad .ok{background:var(--mint);color:#fff;box-shadow:0 5px 0 var(--mint-d)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{height:78px;font-size:38px;font-weight:800;background:#fff;border-radius:22px;box-shadow:0 6px 0 #e2d4ee}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #e2d4ee}
.choice.wrongc{opacity:.35;text-decoration:line-through}
.hint,.explain{background:#fff8e6;border-radius:18px;padding:10px 12px;font-size:18px;line-height:1.35;font-weight:600}
.explain{background:#eefaf5}
.exhead{font-weight:800;color:var(--mint-d)}
.exeq{font-size:34px;font-weight:800}
.explain .btn{margin-top:8px}
.bossbar{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:22px;padding:8px 14px;box-shadow:var(--shadow)}
.gface{font-size:52px;line-height:1;transition:transform .2s}
.gface.hit{animation:wiggle .5s}
.gname{font-weight:800;font-size:17px}
.joy{height:14px;background:#f1e8f8;border-radius:99px;overflow:hidden;margin:3px 0}
.joy i{display:block;height:100%;background:linear-gradient(90deg,#ff9fca,var(--sun));transition:width .4s}
.garden-row{text-align:center;font-size:26px;letter-spacing:2px;background:rgba(255,255,255,.85);border-radius:18px;padding:4px}

/* visuals */
.vis{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
.arr{display:inline-flex;flex-direction:column;gap:3px;line-height:1}
.arr div{white-space:nowrap}
.dots{display:inline-grid;gap:3px}
.dots i{width:var(--d);height:var(--d);border-radius:50%;background:var(--pink)}
.dots i.b{background:var(--mint)}
.tfwrap{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tf{display:grid;grid-template-columns:repeat(5,22px);gap:4px;padding:6px;border:3px solid #e8dcf3;border-radius:12px}
.tf i{width:22px;height:22px;border-radius:50%;background:#f3eef8}
.tf i.a{background:var(--pink)}
.tf i.b{background:var(--mint)}
.cap{font-size:15px;color:var(--muted);font-weight:700}
.ca{color:var(--pink-d)} .cb{color:var(--mint-d)}
.b10{display:inline-flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.grp{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap;max-width:200px}
.rod{width:11px;height:66px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--c) 0 5.6px,rgba(255,255,255,.7) 5.6px 6.6px)}
.cube{width:11px;height:11px;border-radius:2px;background:var(--c)}
.ga{--c:var(--pink)} .gb{--c:var(--mint)}
.plus{font-size:26px;font-weight:800;align-self:center}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(59,42,79,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:30px;padding:22px 18px;max-width:440px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popin .35s cubic-bezier(.3,1.5,.6,1)}
.modal h2{font-size:28px;margin-bottom:6px}
.modal p{font-size:17px;line-height:1.35;margin:6px 0}
.stars3{display:flex;justify-content:center;gap:6px;margin:6px 0}
.bigstar{font-size:62px;color:#eadff3;line-height:1;transition:color .2s}
.bigstar:nth-child(2){font-size:76px;margin-top:-10px}
.bigstar.on{color:#ffc21a;animation:starpop .5s;text-shadow:0 4px 0 #e59a00}
.lcstats{display:flex;justify-content:center;gap:10px;margin:8px 0}
.lcstats div{background:#faf4fd;border-radius:16px;padding:6px 12px;min-width:86px}
.lcstats b{display:block;font-size:24px}
.lcstats small{font-size:13px;color:var(--muted);font-weight:700}
.growth{color:var(--ink);font-weight:600}
.chest{font-size:84px;line-height:1;animation:jiggle 1.2s infinite;padding:4px 10px;border-radius:20px}
.chest.opening{animation:shakebig .6s}
.reward{display:flex;align-items:center;gap:14px;justify-content:center;margin:8px 0;font-size:18px;text-align:left;animation:popin .4s}
.bigyarn{font-size:64px}
.new{color:#fff;background:var(--pink);border-radius:8px;padding:0 6px;font-size:14px}
.nudge{background:#eef5ff;border-radius:16px;padding:10px;margin-top:12px;font-size:16px;line-height:1.35}
.guardian-after{font-size:80px;line-height:1;animation:popin .6s}
.bloom{font-size:30px;letter-spacing:2px}
.hold{position:relative;overflow:hidden;margin-top:10px}
.hold .hf{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffd6ea}
.hold span:last-child{position:relative}
.hold.holding .hf{width:100%;transition:width 2s linear}
#toasts{position:fixed;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
.toast{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(59,42,79,.25);padding:8px 16px 8px 10px;display:flex;align-items:center;gap:10px;font-size:16px;line-height:1.2;animation:slidein .35s cubic-bezier(.3,1.5,.6,1)}
.toast .ti{font-size:34px}
.toast.out{opacity:0;transform:translateY(-20px);transition:all .4s}

/* ---------------- sound (synthesised, no files) ---------------- */
let AC=null;
function ac(){if(!S.settings.sound)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function tone(f,dur=.12,type='sine',vol=.12,when=0,slideTo=null){
  const a=ac();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

/* ---------------- question builders ---------------- */
function fk(p,a,b){return p+Math.min(a,b)+'_'+Math.max(a,b)}
function addQ(a,b){if(a!==b&&Math.random()<.5)[a,b]=[b,a];return{op:'+',a,b,ans:a+b,text:`${a} + ${b}`,key:(a<=10&&b<=10)?fk('a',a,b):null}}
function mulQ(a,b){if(Math.random()<.5)[a,b]=[b,a];return{op:'×',a,b,ans:a*b,text:`${a} × ${b}`,key:(a<=12&&b<=12)?fk('m',a,b):null}}
function missingAddQ(a,total){const b=total-a;return{op:'+',a,b,ans:b,missing:true,text:`${a} + ? = ${total}`,mtext:`${a} + □ = ${total}`,key:(a<=10&&b<=10)?fk('a',a,b):null}}
function missingMulQ(a,b){return{op:'×',a,b,ans:b,missing:true,text:`${a} × ? = ${a*b}`,mtext:`${a} × □ = ${a*b}`,key:fk('m',a,b)}}
function add3Q(){const x=rnd(1,9),y=10-x,z=rnd(2,9);const nums=shuffle([x,y,z]);return{op:'+3',nums,ans:x+y+z,text:nums.join(' + '),key:null,pair:[x,y],z}}

  const q=big?G.d2d2():G.add20();const {a,b}=q,c=catName();
  q.word=pick([`${c} read ${a} pages of a magic book, then ${b} more pages. How many pages did ${c} read?`,

    `A crystal glows ${a} times, then ${b} more times. How many glows altogether?`]);
  return q;
}
function wordMulQ(tables){
  const q=mulQ(pick(tables),rnd(2,10));const {a,b}=q,c=catName(),n=S.name||'You';
  q.word=pick([`${c} sets out ${a} plates with ${b} fish treats on each. How many treats is that?`,
    `At the Cat Concert there are ${a} rows with ${b} kittens in each row. How many kittens?`,

    `A spell book has ${a} pages with ${b} spells on every page. How many spells?`,
    `${n} draws ${a} pictures with ${b} cats in each one. How many cats were drawn?`]);
  return q;
}
const G={
  add10:()=>{const a=rnd(1,8);return addQ(a,rnd(1,10-a))},
  bond10:()=>missingAddQ(rnd(1,9),10),
  bridge10:()=>{const a=rnd(6,9);return addQ(a,rnd(11-a,9))},
  add20:()=>{const a=rnd(3,15);return addQ(a,rnd(2,20-a))},
  doubles:()=>{const a=rnd(2,9);return addQ(a,a+pick([0,0,1]))},
  add3:()=>add3Q(),
  tens:()=>{if(Math.random()<.5){const a=rnd(1,7);return addQ(a*10,rnd(1,9-a)*10)}const a=rnd(11,69);return addQ(a,rnd(1,Math.floor((99-a)/10))*10)},
  d2d1:()=>{const t=rnd(1,8),o=rnd(0,6);return addQ(t*10+o,rnd(1,9-o))},

/* spaced repetition: Leitner boxes per fact (days until next review) */
const BOXDAYS=[0,1,2,4,7,14];
function recordFact(q,good){
  if(!q||!q.key)return;const t=dayKey();
  const f=S.facts[q.key]||(S.facts[q.key]={box:0,due:t,seen:0,right:0,wrong:0,last:null});
  f.seen++;
  if(good){f.right++;if(f.last!==t||f.box===0)f.box=Math.min(5,f.box+1)}
  else{f.wrong++;f.box=Math.max(0,f.box-2)}
  f.last=t;f.due=addDays(t,BOXDAYS[f.box]);
}
function dueFacts(){const t=dayKey();return Object.entries(S.facts).filter(([,f])=>f.due<=t).sort((a,b)=>a[1].box-b[1].box).map(e=>e[0])}
function weakFacts(){return Object.entries(S.facts).sort((a,b)=>(a[1].box-b[1].box)||(b[1].wrong-a[1].wrong)).map(e=>e[0])}
function factToQ(k){const [a,b]=k.slice(1).split('_').map(Number);return k[0]==='m'?mulQ(a,b):addQ(a,b)}
function factLabel(k){const [a,b]=k.slice(1).split('_').map(Number);return k[0]==='m'?`${a} × ${b}`:`${a} + ${b}`}
function tableStrong(t){return range(1,12).filter(m=>{const f=S.facts[fk('m',t,m)];return f&&f.box>=3}).length}

/* ---------------- teaching: hints, strategies, pictures ---------------- */
function tip(q,full){
  if(q.op==='+3'){const [x,y]=q.pair;return full?`${x} + ${y} = 10, then 10 + ${q.z} = ${q.ans}.`:`Find two numbers that make 10 first — then add the last one!`}
  if(q.op==='×'){
    if(q.missing){const c=q.a*q.b;return full?`${q.a} × ${q.b} = ${c}, so the missing number is ${q.b}.`:`Count up in ${q.a}s until you reach ${c}. How many jumps did you make?`}
    const order=[1,10,2,5,11,9,4,3,6,8,12,7];const t=order.find(x=>x===q.a||x===q.b);const m=t===q.a?q.b:q.a;const A=q.ans;
    switch(t){
      case 1:return `Anything × 1 stays the same!${full?` So it's ${A}.`:''}`;
      case 10:return full?`${m} tens make ${A}.`:`How much is ${m} tens? (Each ten is 10.)`;
      case 2:return full?`× 2 means double: ${m} + ${m} = ${A}.`:`× 2 means double! What is ${m} + ${m}?`;
      case 5:return full?`10 × ${m} = ${10*m}. Half of that is ${A}.`:`Do 10 × ${m} = ${10*m}, then find half of it.`;
      case 11:return m<=9?(full?`11 × ${m}: the ${m} shows up twice → ${A}.`:`Secret: 11 × a single digit makes that digit show up twice!`):(full?`10 × ${m} = ${10*m}, plus one more ${m} = ${A}.`:`10 × ${m} = ${10*m}. Now add one more ${m}.`);
      case 9:return full?`10 × ${m} = ${10*m}, take away one ${m} → ${A}.`:`10 × ${m} = ${10*m}. Now take away one ${m}.`;
      case 4:return full?`Double, then double again: ${m} → ${2*m} → ${A}.`:`Double, then double again: ${m} → ${2*m} → ?`;
      case 3:return full?`Double ${m} is ${2*m}, plus one more ${m} → ${A}.`:`Double ${m} is ${2*m}. Now add one more ${m}.`;
      case 6:return full?`5 × ${m} = ${5*m}, plus one more ${m} → ${A}.`:`5 × ${m} = ${5*m}. Now add one more ${m}.`;
      case 8:return full?`Double three times: ${m} → ${2*m} → ${4*m} → ${A}.`:`Double three times: ${m} → ${2*m} → ${4*m} → ?`;
      case 12:return full?`10 × ${m} = ${10*m}, plus 2 × ${m} = ${2*m} → ${A}.`:`10 × ${m} = ${10*m}. Now add 2 × ${m} = ${2*m}.`;
      case 7:return full?`5 × ${m} = ${5*m}, plus 2 × ${m} = ${2*m} → ${A}.`:`Split 7 into 5 + 2: 5 × ${m} = ${5*m} and 2 × ${m} = ${2*m}.`;
    }
  }
  const {a,b}=q,s=a+b;
  if(q.missing)return full?`${a} + ${b} = ${s}, so the missing number is ${b}.`:`Start at ${a} and count up to ${s}. How many jumps?`;
  const big=Math.max(a,b),small=Math.min(a,b);
  if(big<=10){
    if(a===b)return full?`Double ${a} = ${s}.`:`It's a double! What is double ${a}?`;
    if(big-small===1)return full?`Near double: double ${small} = ${2*small}, plus 1 = ${s}.`:`Near double! Double ${small} = ${2*small}… then add 1.`;
    if(s>10){const need=10-big,left=small-need;return full?`Make 10: ${big} + ${need} = 10, then 10 + ${left} = ${s}.`:`Make 10 first: ${big} + ${need} = 10. Then add the ${left} left over.`}
    return full?`Start at ${big}, count on ${small} → ${s}.`:`Start at the bigger number, ${big}, and count on ${small}.`;
  }
  const ta=a-a%10,oa=a%10,tb=b-b%10,ob=b%10,T=ta+tb,O=oa+ob;
  if(oa===0&&ob===0)return full?`${ta/10} tens + ${tb/10} tens = ${T/10} tens = ${s}.`:`Think in tens: ${ta/10} tens + ${tb/10} tens = ? tens`;
  const h=(ta===0||tb===0)?`Tens: ${T}. Ones: ${oa} + ${ob} = ${O}.`:`Tens first: ${ta} + ${tb} = ${T}. Then ones: ${oa} + ${ob} = ${O}.`;
  return full?`${h} Together: ${T} + ${O} = ${s}.`:`${h} Now put them together!`;
}
function visual(q,reveal){
  if(q.op==='×'){
    if(q.missing&&!reveal)return '';
    let r=Math.min(q.a,q.b),c=Math.max(q.a,q.b);if(q.missing){r=q.a;c=q.b}
    if(r*c<=40){const fs=c>8?16:c>5?20:24;
      return `<div class="vis"><div class="arr" style="font-size:${fs}px">${Array.from({length:r},()=>`<div>${'🐱'.repeat(c)}</div>`).join('')}</div><div class="cap">${r} row${r>1?'s':''} of ${c}</div></div>`}
    const split=c>10?10:(c>5?5:0);let cells='';
    for(let i=0;i<r;i++)for(let j=0;j<c;j++)cells+=`<i class="${split&&j>=split?'b':''}"></i>`;
    return `<div class="vis"><div class="dots" style="grid-template-columns:repeat(${c},var(--d))">${cells}</div><div class="cap">${r} rows of ${c}${split?` → ${r} × ${split} and ${r} × ${c-split}`:''}</div></div>`;
  }
  if(q.op==='+'&&(!q.missing||reveal)&&q.a<=10&&q.b<=10){
    const tot=q.a+q.b,frames=tot>10?2:1;let html='',k=0;
    for(let f=0;f<frames;f++){let cells='';for(let i=0;i<10;i++,k++)cells+=`<i class="${k<q.a?'a':k<tot?'b':''}"></i>`;html+=`<div class="tf">${cells}</div>`}
    return `<div class="vis"><div class="tfwrap">${html}</div><div class="cap"><span class="ca">${q.a}</span> + <span class="cb">${q.b}</span></div></div>`;
  }
  if(q.op==='+'&&(!q.missing||reveal)){
    const g=(n,cls)=>`<div class="grp ${cls}">${'<i class="rod"></i>'.repeat(Math.floor(n/10))}${'<i class="cube"></i>'.repeat(n%10)}</div>`;
    return `<div class="vis"><div class="b10">${g(q.a,'ga')}<span class="plus">+</span>${g(q.b,'gb')}</div><div class="cap">tall sticks = tens · little cubes = ones</div></div>`;
  }
  return '';
}
function plainEq(q){if(q.op==='+3')return `${q.nums.join(' + ')} = ${q.ans}`;return `${q.a} ${q.op} ${q.b} = ${q.op==='×'?q.a*q.b:q.a+q.b}`}
function qPlain(q){return q.missing?q.text:q.text+' = ?'}
function choicesFor(q){
  const ans=q.ans,set=new Set([ans]);
  const c=(q.op==='×'&&!q.missing)?[(q.a+1)*q.b,(q.a-1)*q.b,q.a*(q.b+1),q.a*(q.b-1),ans+1,ans-1,q.a+q.b]:[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10];
  for(const v of shuffle(c)){if(set.size>=4)break;if(v>0&&v!==ans)set.add(v)}
  let k=3;while(set.size<4)set.add(ans+k++);
  return shuffle([...set]);
}

  }

  h+=`<div class="realm-track">${R.track} · ${done}/${R.levels.length} crystals glowing</div><p class="realm-intro">${R.intro}</p>`;

function pathHTML(ri){

  const cur=currentLevel(ri);
  let s=`<div class="path" style="width:${W}px;height:${H}px"><svg class="trail" width="${W}" height="${H}"><path d="${d}" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 22"/></svg>`;
  R.levels.forEach((L,i)=>{

  });
  return s+'</div>';
}

let studio=null;
function setupDraw(cv,tool,onStart,onEnd){
  const ctx=cv.getContext('2d');let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const t=tool(),p=pos(e);onStart&&onStart();
    if(t.stamp){ctx.font=`${t.size*4+20}px "Segoe UI Emoji","Apple Color Emoji",serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.stamp,p.x,p.y);onEnd&&onEnd();return}
    drawing=true;last=p;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=t.color;ctx.lineWidth=t.size;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e),t=tool();ctx.strokeStyle=t.color;ctx.lineWidth=t.size;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
  const end=()=>{if(drawing){drawing=false;onEnd&&onEnd()}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return ctx;
}
function initStudio(){
  const cv=$('#cv');if(!cv)return;
  const undo=[];
  const ctx=setupDraw(cv,()=>({color:UI.dcolor,size:UI.dsize,stamp:UI.dstamp}),

    ()=>{UI.draft=cv.toDataURL()});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,600,600);
  if(UI.draft){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=UI.draft}
  studio={cv,ctx,undo};updateTools();
}
function updateTools(){

function buildQueue(gen,n,{review=true}={}){
  const qs=[],seen=new Set();let guard=0;
  while(qs.length<n&&guard++<300){const q=gen();const sig=q.text+(q.word||'');if(seen.has(sig)&&guard<200)continue;seen.add(sig);qs.push(q)}
  if(review&&n>=8){const due=shuffle(dueFacts().filter(k=>!qs.some(q=>q.key===k))).slice(0,2);due.forEach((k,j)=>{const q=factToQ(k);q.review=true;qs[j===0?3:6]=q})}
  return qs;
}

  const wk=((day-1)%7)+1;
  modal(`<h2>Daily gift! 🎁</h2>${catHTML(110,'happy',{cls:'bounce'})}<p><b>Day ${day}</b> in a row${day>1?' — amazing!':'. Welcome!'}</p>
   <div style="font-size:30px;letter-spacing:4px">${range(1,7).map(i=>i<=wk?'🔥':'⚪').join('')}</div>
   <p>+${y} 🧶 ${st?`<br>Day 7 bonus: <b>${st.s[2]}</b> ${st.s[1]} sticker!`:'<br><span class="tiny">Come back every day: the gift grows, and day 7 has a special sticker!</span>'}</p>
   ${napped?`<p class="nudge">😴 ${esc(catName())} took a cat nap for you yesterday and kept your streak safe!</p>`:''}
   <button class="btn big" data-act="close" style="margin-top:8px">Yay!</button>`);
  sfx.chest();confetti(40);
}

/* ---------------- feedback fx ---------------- */
function burst(x,y,emojis,n=10,spread=120){
  for(let k=0;k<n;k++){const p=document.createElement('span');p.className='p';p.textContent=pick(emojis);
    const ang=Math.random()*Math.PI*2,d=spread*(.4+Math.random()*.8);p.style.left=x+'px';p.style.top=y+'px';
    p.style.setProperty('--dx',Math.cos(ang)*d+'px');p.style.setProperty('--dy',(Math.sin(ang)*d-30)+'px');p.style.setProperty('--rot',rnd(-90,90)+'deg');
    document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
}
function confetti(n=50){
  const em=['🎉','⭐','💖','✨','🌸','🐾','🎀','💎'];
  for(let k=0;k<n;k++){const c=document.createElement('span');c.className='cf';c.textContent=pick(em);c.style.left=Math.random()*100+'vw';
    const dur=1.6+Math.random()*1.4;c.style.animationDuration=dur+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.setProperty('--rot',rnd(-360,360)+'deg');c.style.fontSize=rnd(16,30)+'px';
    document.body.appendChild(c);setTimeout(()=>c.remove(),(dur+.5)*1000)}
}
function flyYarn(from){
  const t=$('#yarnN');if(!from||!t)return;const a=from.getBoundingClientRect(),b=t.getBoundingClientRect();
  const s=document.createElement('span');s.className='flyy';s.textContent='🧶';const x0=a.left+a.width/2,y0=a.top+a.height/2;s.style.left=x0+'px';s.style.top=y0+'px';document.body.appendChild(s);
  const dx=b.left+b.width/2-x0,dy=b.top+b.height/2-y0;
  const done=()=>{s.remove();const y=$('#yarnN');if(y){y.textContent=S.yarn;const pl=y.parentElement;pl.classList.remove('pop');void pl.offsetWidth;pl.classList.add('pop')}};
  if(s.animate){s.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.6)`}],{duration:650,easing:'cubic-bezier(.5,0,.8,.6)'}).onfinish=done}else done();
}
function toast(html){const d=document.createElement('div');d.className='toast';d.innerHTML=html;$('#toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),2800);setTimeout(()=>d.remove(),3300)}
function badge(id){if(S.badges.includes(id)||!BADGES[id])return;S.badges.push(id);const b=BADGES[id];setTimeout(()=>{toast(`<span class="ti">${b[0]}</span><div><b>Badge earned!</b><br>${b[1]}</div>`);sfx.fanfare()},300);save()}
function modal(html){closeModal();const o=document.createElement('div');o.className='overlay';o.id='overlay';o.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(o)}
function closeModal(){const o=$('#overlay');if(o)o.remove()}
function petCat(el){sfx.meow();const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/3,['💖','💕','✨'],8,90);const b=$('#bubble');if(b)b.textContent=pick(['Purrrrr… 💖','Mrrow! Let’s play!',companionLine(),companionLine()]);const c=el.querySelector('.cat');if(c){c.outerHTML=catHTML(92,'happy',{cls:'bounce'})}setTimeout(()=>{const k=el.querySelector('.cat');if(k&&UI.tab==='map')k.outerHTML=catHTML(92,'normal',{cls:'idle'})},1400)}
function shakeEl(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

/* ---------------- actions ---------------- */
const ACT={
  tab:d=>{UI.tab=d.tab;UI.screen='home';sfx.tap();render();scrollTo(0,0)},
  realm:d=>{UI.realm=Math.max(0,Math.min(REALMS.length-1,UI.realm+Number(d.d)));sfx.tap();render()},
  realmGo:d=>{UI.realm=Number(d.r);sfx.tap();render()},
  start:d=>{sfx.tap();startLevel(Number(d.r),Number(d.l))},
  nextLevel:d=>startLevel(Number(d.r),Number(d.l)),
  again:()=>again(),
  key:d=>press(d.k),
  choice:d=>{if(P&&!P.locked&&!P.explaining)submit(Number(d.v))},
  hint:()=>useHint(),
  gotit:()=>{if(P&&P.explaining){P.explaining=false;next()}},
  scratch:()=>openScratch(),
  scratchClose:()=>closeScratch(false),
  scratchClear:()=>{const c=$('#scv');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);if(P)P.scratch=null}},
  quit:()=>{if(P&&P.mode==='lightning'&&P.timer){clearInterval(P.timer);P.timer=null}modal(`<h2>Take a break?</h2><p>You'll keep all the yarn you've earned. ${P&&P.mode==='lightning'?'':'Stars are saved when you finish a level.'}</p><div class="row" style="margin-top:12px"><button class="btn mint" data-act="resume">Keep playing</button><button class="btn ghost" data-act="toMap">Leave</button></div>`)},
  resume:()=>{closeModal();if(P&&P.mode==='lightning'){finishLightning()}},
  toMap:()=>endPlay(),
  close:()=>{closeModal();sfx.tap()},
  openChest:(d,el)=>openChest(el),
  pet:(d,el)=>petCat(el),
  garden:()=>startGarden(),
  lightning:()=>startLightning(),
  table:d=>startTable(Number(d.t)),
  fur:d=>chooseFur(d.id),
  item:d=>itemAction(d.id),
  rename:()=>{const n=prompt('New name for your cat:',catName());if(n&&n.trim()){S.catName=n.trim().slice(0,14);save();render()}},
  album:d=>{UI.albumTab=d.t;sfx.tap();render()},
  viewDrawing:d=>viewDrawing(Number(d.i)),
  delDrawing:d=>delDrawing(Number(d.i)),
  delYes:d=>{S.drawings.splice(Number(d.i),1);save();closeModal();render()},
  dcolor:d=>{UI.dcolor=d.c;UI.dstamp=null;sfx.tap();updateTools()},
  dsize:d=>{UI.dsize=Number(d.s);sfx.tap();updateTools()},
  dstamp:d=>{UI.dstamp=UI.dstamp===d.s?null:d.s;sfx.tap();updateTools()},
  dundo:()=>{if(studio&&studio.undo.length){studio.ctx.putImageData(studio.undo.pop(),0,0);UI.draft=studio.cv.toDataURL()}},
  dclear:()=>{if(!studio)return;studio.undo.push(studio.ctx.getImageData(0,0,600,600));studio.ctx.fillStyle='#fff';studio.ctx.fillRect(0,0,600,600);UI.draft=null},
  dsave:()=>studioSave(),
  chCheck:()=>{const i=$('#chAns'),ch=todayChallenge();if(!i)return;if(Number(i.value)===ch.a){S.challengeDay=dayKey();S.yarn+=20;badge('challenge');save();sfx.chest();confetti(40);toast(`<span class="ti">🖍️</span><div><b>Correct! +20 🧶</b><br>Maths and art — the perfect combo!</div>`);const draft=studio&&studio.cv.toDataURL();UI.draft=draft||UI.draft;render()}else{sfx.wrong();shakeEl(i);toast(`<span class="ti">🔍</span><div>Count again carefully. You can do it!</div>`)}},
  parents:()=>parentGate(),
  setSound:d=>{S.settings.sound=d.v==='1';save();render()},
  setBreak:d=>{S.settings.breakMins=Number(d.m);save();render()},
  reset:()=>{if(confirm('Erase ALL progress, stars, stickers and drawings?')&&confirm('Are you really sure? This cannot be undone.')){localStorage.removeItem(SAVE_KEY);location.reload()}},
  ob1:()=>{const v=$('#nm').value.trim();if(!v)return shakeEl($('#nm'));UI.tmpName=v.slice(0,16);UI.onboard=1;sfx.tap();render()},
  obfur:d=>{const c=$('#cn');if(c)UI.tmpCat=c.value;UI.tmpFur=d.id;sfx.meow();render()},
  obname:d=>{UI.tmpCat=d.n;const c=$('#cn');if(c)c.value=d.n;sfx.tap()},
  ob2:()=>{const v=$('#cn').value.trim();if(!v)return shakeEl($('#cn'));UI.tmpCat=v.slice(0,14);UI.onboard=2;sfx.tap();render()},
  obgo:()=>{S.name=UI.tmpName;S.catName=UI.tmpCat;S.fur=UI.tmpFur||'ginger';save();UI.tab='map';sfx.fanfare();render();setTimeout(checkDaily,500)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn)fn(el.dataset,el,e)});
document.addEventListener('keydown',e=>{
  if(!S.name){if(e.key==='Enter'){const b=document.querySelector('[data-primary]');if(b){e.preventDefault();b.click()}}return}
  if(e.target&&e.target.id==='chAns'&&e.key==='Enter'){ACT.chCheck();return}
  if(UI.screen!=='play'||!P||$('#overlay')||$('#scratch'))return;
  if(/^[0-9]$/.test(e.key)){if(P.mc){const bs=[...document.querySelectorAll('.choice')],b=bs[Number(e.key)-1];if(b&&!b.disabled)b.click()}else press(e.key)}
  else if(e.key==='Backspace'){e.preventDefault();press('del')}
  else if(e.key==='Enter'){e.preventDefault();if(P.explaining)ACT.gotit();else press('ok')}
});
setInterval(()=>{if(!document.hidden&&S.name){S.stats.seconds+=10;save()}},10000);

/* ---------------- go! ---------------- */
(function boot(){
  const cur=REALMS.findIndex((_,i)=>realmUnlocked(i)&&currentLevel(i)>=0);if(cur>=0)UI.realm=cur;
  render();if(S.name)setTimeout(checkDaily,500);
})();
</script>
</body>
</html>
